[package]
name = "obz-gui"
version = "0.10.1"
edition = "2021"
description = "qing-zip desktop archiver (Tauri)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
obz-core = { path = "../obz-rs", package = "obz-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
encoding_rs = "=0.8.35"
tauri-plugin-single-instance = "=2.5.4"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }

windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

windows-core = "=0.62.2"

[profile.release]
opt-level = 3
lto = true
