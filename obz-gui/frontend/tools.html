<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>归档工具</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="progress.css"><link rel="stylesheet" href="tools.css"></head><body class="qa-tools">
<h1>归档工具</h1><p>创建、提取、检查与维护压缩包。所有操作均使用真实归档引擎。</p>
<form id="form"><fieldset id="fields"><div class="grid">
<div class="wide" id="operation-group"><label for="operation">操作</label><select id="operation">
<option value="list">查看文件列表</option><option value="extract">解压文件</option><option value="create">新建压缩包</option><option value="test">检查完整性</option><option value="add">添加或更新文件</option><option value="delete">删除包内条目</option><option value="rename">重命名包内条目</option><option value="preview">预览图片</option><option value="repair">修复损坏的 ZIP</option><option value="recover">找回压缩包密码</option><option value="file-split">分割文件</option><option value="file-combine">合并文件</option><option value="benchmark">引擎基准测试</option><option value="checksum">计算文件校验值</option><option value="vault-list">查看保存的密码名称</option><option value="vault-put">保存密码</option><option value="vault-delete">删除已保存的密码</option><option value="shell-enable">启用资源管理器右键入口</option><option value="shell-disable">移除资源管理器右键入口</option><option value="capabilities">查看当前支持能力</option>
</select></div>
<div class="wide hidden" id="benchmark-group"><div class="grid"><div><label for="bench-threads">线程数</label><input id="bench-threads" type="number" min="1" max="256" value="2"></div><div><label for="bench-dictionary">字典大小</label><select id="bench-dictionary"><option value="18">256 KiB</option><option value="20">1 MiB</option><option value="22">4 MiB</option><option value="24" selected>16 MiB</option><option value="26">64 MiB</option><option value="28">256 MiB</option></select></div><div><label for="bench-iterations">测试轮数</label><input id="bench-iterations" type="number" min="1" max="20" value="1"></div></div><p>使用引擎生成的数据测量 LZMA 压缩和解压能力。结果不代表实际压缩包的磁盘读写速度；可随时取消。</p></div>
<div class="wide" id="path-group"><label for="path" id="path-label">压缩包路径</label><div class="row"><input id="path" placeholder="选择或输入文件路径"><button class="qa-button" type="button" id="browse">浏览…</button></div></div>
<div class="wide hidden" id="checksum-paths-group"><label id="checksum-paths-label" for="checksum-paths">待校验文件或文件夹（每行一个路径）</label><textarea id="checksum-paths" rows="3"></textarea><button class="qa-button" type="button" id="checksum-browse">选择文件…</button><button class="qa-button" type="button" id="checksum-folder">选择文件夹…</button></div>
<div class="wide hidden" id="hash-group"><label for="hash-algorithm">校验算法</label><select id="hash-algorithm"><option value="">常用：CRC32 / MD5 / SHA1 / SHA256</option></select><div id="hash-choices" class="hidden" role="group" aria-label="自选校验算法"></div></div>
<div class="wide hidden" id="dest-group"><label for="dest" id="dest-label">解压到</label><div class="row"><input id="dest"><button class="qa-button" type="button" id="browse-dest">浏览…</button></div></div>
<div class="wide hidden" id="parts-size-group"><label id="parts-size-label" for="parts-size">每块大小</label><div class="row"><input id="parts-size" type="number" min="1" step="1" value="100"><select id="parts-unit"><option value="1">字节</option><option value="1024">KiB</option><option value="1048576" selected>MiB</option><option value="1073741824">GiB</option></select></div></div>
<div class="wide hidden" id="parts-total-group"><label for="parts-total">原文件总字节数（可选，用于检查缺卷）</label><input id="parts-total" type="number" min="0" step="1"></div>
<div class="wide hidden" id="inputs-group"><label for="inputs" id="inputs-label">输入文件（每行一个完整路径）</label><textarea id="inputs"></textarea><div class="row"><button class="qa-button" type="button" id="files">选择文件…</button><button class="qa-button" type="button" id="folder">添加文件夹…</button></div></div>
<div class="wide hidden" id="vault-actions"><button class="qa-button primary" type="button" id="vault-add">添加密码</button></div>
<div class="wide hidden" id="name-group"><label for="name" id="name-label">条目名称</label><input id="name"><select id="archive-image" class="hidden"></select></div>
<div class="wide hidden" id="label-group"><label for="label">密码备注（可选）</label><input id="label" placeholder="例如：工作备份"></div>
<div id="format-group" class="hidden"><label for="format">创建格式</label><select id="format"><option value="zip">ZIP</option><option value="zipx">ZIPX（XZ）</option><option value="7z">7z</option><option value="tar">TAR</option><option value="tgz">TAR.GZ</option><option value="tbz2">TAR.BZ2</option><option value="txz">TAR.XZ</option><option value="gzip">GZip（单文件）</option><option value="xz">XZ（单文件）</option><option value="bzip2">BZip2（单文件）</option><option value="zstd">Zstandard（单文件）</option><option value="brotli">Brotli（单文件）</option><option value="lz4">LZ4（单文件）</option><option value="lz5">LZ5（单文件）</option><option value="lizard">Lizard（单文件）</option><option value="wim">WIM</option><option value="sfx">EXE 自解压包</option><option value="iso">ISO 光盘镜像</option><option value="lzh">LZH（LH7）</option></select></div>
<div id="overwrite-group" class="hidden"><label for="overwrite">目标文件已存在时</label><select id="overwrite"><option value="error">停止并报告冲突</option><option value="skip">跳过已有文件</option><option value="rename">自动重命名新文件</option><option value="overwrite">替换已有文件</option></select></div>
<div id="password-group"><label for="password">密码（需要时填写）</label><input id="password" type="password" autocomplete="off"></div>
<div id="password-id-group"><label for="password-id">或使用保存的密码 ID</label><input id="password-id" autocomplete="off" placeholder="与直接输入密码二选一"></div>
<div class="wide hidden" id="selected-group"><label for="selected">只提取这些条目（包内完整名称，每行一个；留空提取全部）</label><textarea id="selected"></textarea><label class="check"><input id="smart" type="checkbox">智能解压</label></div>
<div class="wide hidden" id="recovery-group"><label for="candidates">候选密码（每行一个，仅用于你有权访问的压缩包）</label><textarea id="candidates" autocomplete="off"></textarea><label for="charset">或枚举字符集（填写后优先使用，留空使用候选列表）</label><input id="charset" autocomplete="off" placeholder="例如：0123456789"><div class="grid"><div><label for="min-length">最短长度</label><input id="min-length" type="number" min="1" max="64" value="1"></div><div><label for="max-length">最长长度</label><input id="max-length" type="number" min="1" max="64" value="4"></div></div><label for="max-attempts">最多尝试次数</label><input id="max-attempts" type="number" min="1" max="1000000" value="1000"></div>
</div>
<details id="advanced"><summary>压缩与兼容性设置</summary><div class="grid"><div><label for="level">压缩级别</label><select id="level"><option value="">默认</option><option value="0">仅存储</option><option value="1">快速</option><option value="5">标准</option><option value="9">最大</option></select></div><div><label for="threads">线程数（留空由引擎决定）</label><input id="threads" type="number" min="1" max="256"></div><div><label for="volume">分卷大小（MiB，留空不分卷）</label><input id="volume" type="number" min="1"></div><div><label for="codepage">旧格式文件名代码页（例如 936）</label><input id="codepage" type="number" min="1"></div></div></details>
<div id="hint"></div></fieldset><div id="runbar"><button class="qa-button primary" type="submit" id="run">查看文件列表</button><button class="qa-button hidden" type="button" id="tool-back"></button><button class="qa-button hidden" type="button" id="cancel" disabled>取消任务</button><span id="status" role="status"></span></div><div id="progress" class="qa-progress hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="status"><span></span></div></form><div id="result" aria-live="polite"></div>
<script src="compression-options.js"></script><script src="appearance.js"></script><script src="progress.js"></script><script src="tools.js"></script></body></html>
