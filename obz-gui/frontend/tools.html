<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>归档工具</title>
<style>
:root{color-scheme:light dark;background:light-dark(#f6f9fc,#182638)!important;color:light-dark(#20262e,#edf0f6)!important}input,select,textarea,button{background:light-dark(#fff,#223247)!important;color:inherit!important;border-color:light-dark(#c9d5e4,#40516a)!important}.primary{background:light-dark(#2861c2,#8bb7ff)!important;color:light-dark(#fff,#142b50)!important}label,p,small{color:light-dark(#58697c,#b1bfd0)!important}

:root{color-scheme:dark;font:14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif;background:#131519;color:#e8eaee}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1100px;margin:auto}h1{font-size:22px;margin:0 0 5px}p{color:#9aa3b2;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}label{display:block;color:#b5bdca;font-size:12px;margin-bottom:5px}input,select,textarea,button{font:inherit;border:1px solid #343a45;border-radius:7px;background:#1e222a;color:inherit;padding:9px 11px}input,select,textarea{width:100%}textarea{min-height:78px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #e0a13c;outline-offset:1px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}button{cursor:pointer;white-space:nowrap}button:hover{border-color:#e0a13c}button:disabled{opacity:.4;cursor:default}.primary{background:#e0a13c;color:#17120a;font-weight:600;border-color:#e0a13c}details{border-top:1px solid #343a45;padding-top:12px;margin-top:16px}summary{cursor:pointer;color:#b5bdca;margin-bottom:12px}small{color:#929dad}#runbar{display:flex;gap:10px;margin-top:20px;align-items:center}progress{width:100%;height:8px;margin:12px 0;accent-color:#e0a13c}#status{color:#a9b5c7;overflow-wrap:anywhere}#result{margin-top:18px;border-top:1px solid #343a45;padding-top:16px;overflow-wrap:anywhere}.error{color:#ff9b9b!important}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:7px;border-bottom:1px solid #2a2f3a}td:first-child{max-width:420px;overflow-wrap:anywhere}#preview{max-width:100%;max-height:400px;object-fit:contain;background:#20242b;border-radius:8px}.hidden{display:none!important}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}fieldset{border:0;padding:0;margin:0;min-width:0}#hint{margin:10px 0;color:#9aa3b2;font-size:12px}.secret{font-family:Consolas,monospace}

:root{background:light-dark(#fbfcfe,#212c3b)!important;color:light-dark(#26364c,#edf2fc)!important;font-family:'Segoe UI Variable','Segoe UI','Microsoft YaHei UI',sans-serif}body{padding:0}input,select,textarea,button{border-radius:8px;border-color:light-dark(#e3e9f2,#354256)!important}input,select,textarea{background:light-dark(#fff,#2a3546)!important}button{cursor:default}.primary{background:light-dark(#486de3,#9db6ff)!important;color:light-dark(#fff,#182953)!important;font-weight:500}label,p,small,summary{color:light-dark(#728098,#a6b4ca)!important}input:focus,select:focus,textarea:focus{outline-color:light-dark(#486de3,#9db6ff)}progress{accent-color:light-dark(#486de3,#9db6ff)}details,#result,td,th{border-color:light-dark(#e3e9f2,#354256)}.grid{gap:17px}button:hover{background:light-dark(#f2f5fb,#273348)!important}button.primary:hover{background:light-dark(#3d61d8,#afc3ff)!important}#runbar{margin-top:24px}#status{font-size:12px}table{table-layout:fixed}td{overflow-wrap:anywhere}
*{scrollbar-width:auto;scrollbar-color:auto}*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-thumb{border:2px solid transparent;background:light-dark(#72809860,#a6b4ca60);background-clip:padding-box;border-radius:8px}*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
</style></head><body>
<h1>归档工具</h1><p>创建、提取、检查与维护压缩包。所有操作均使用真实归档引擎。</p>
<form id="form"><fieldset id="fields"><div class="grid">
<div class="wide"><label for="operation">操作</label><select id="operation">
<option value="list">查看文件列表</option><option value="extract">解压文件</option><option value="create">新建压缩包</option><option value="test">检查完整性</option><option value="add">添加或更新文件</option><option value="delete">删除包内条目</option><option value="rename">重命名包内条目</option><option value="preview">预览图片</option><option value="repair">修复损坏的 ZIP</option><option value="recover">找回压缩包密码</option><option value="checksum">计算文件校验值</option><option value="scan">使用 Windows Defender 扫描文件</option><option value="vault-list">查看保存的密码名称</option><option value="vault-put">保存密码</option><option value="vault-delete">删除已保存的密码</option><option value="shell-enable">启用资源管理器右键入口</option><option value="shell-disable">移除资源管理器右键入口</option><option value="capabilities">查看当前支持能力</option>
</select></div>
<div class="wide" id="path-group"><label for="path" id="path-label">压缩包路径</label><div class="row"><input id="path" placeholder="选择或输入文件路径"><button type="button" id="browse">浏览…</button></div></div>
<div class="wide hidden" id="dest-group"><label for="dest" id="dest-label">解压到</label><div class="row"><input id="dest"><button type="button" id="browse-dest">浏览…</button></div></div>
<div class="wide hidden" id="inputs-group"><label for="inputs" id="inputs-label">输入文件（每行一个完整路径）</label><textarea id="inputs"></textarea><div class="row"><button type="button" id="files">选择文件…</button><button type="button" id="folder">添加文件夹…</button></div></div>
<div class="wide hidden" id="name-group"><label for="name" id="name-label">条目名称</label><input id="name"></div>
<div class="wide hidden" id="label-group"><label for="label">密码备注（不会显示密码正文）</label><input id="label" placeholder="例如：工作备份"></div>
<div id="format-group" class="hidden"><label for="format">创建格式</label><select id="format"><option value="zip">ZIP</option><option value="zipx">ZIPX（XZ）</option><option value="7z">7z</option><option value="tar">TAR</option><option value="tgz">TAR.GZ</option><option value="tbz2">TAR.BZ2</option><option value="txz">TAR.XZ</option><option value="gzip">GZip（单文件）</option><option value="xz">XZ（单文件）</option><option value="bzip2">BZip2（单文件）</option><option value="wim">WIM</option><option value="sfx">EXE 自解压包</option><option value="iso">ISO 光盘镜像</option><option value="lzh">LZH（LH7）</option></select></div>
<div id="overwrite-group" class="hidden"><label for="overwrite">目标文件已存在时</label><select id="overwrite"><option value="error">停止并报告冲突</option><option value="skip">跳过已有文件</option><option value="rename">自动重命名新文件</option><option value="overwrite">替换已有文件</option></select></div>
<div id="password-group"><label for="password">密码（需要时填写）</label><input id="password" type="password" autocomplete="off"></div>
<div id="password-id-group"><label for="password-id">或使用保存的密码 ID</label><input id="password-id" autocomplete="off" placeholder="与直接输入密码二选一"></div>
<div class="wide hidden" id="selected-group"><label for="selected">只提取这些条目（包内完整名称，每行一个；留空提取全部）</label><textarea id="selected"></textarea><label class="check"><input id="smart" type="checkbox">多个散落文件自动放入同名文件夹</label></div>
<div class="wide hidden" id="recovery-group"><label for="candidates">候选密码（每行一个，仅用于你有权访问的压缩包）</label><textarea id="candidates" autocomplete="off"></textarea><label for="charset">或枚举字符集（填写后优先使用，留空使用候选列表）</label><input id="charset" autocomplete="off" placeholder="例如：0123456789"><div class="grid"><div><label for="min-length">最短长度</label><input id="min-length" type="number" min="1" max="64" value="1"></div><div><label for="max-length">最长长度</label><input id="max-length" type="number" min="1" max="64" value="4"></div></div><label for="max-attempts">最多尝试次数</label><input id="max-attempts" type="number" min="1" max="1000000" value="1000"></div>
</div>
<details id="advanced"><summary>压缩与兼容性设置</summary><div class="grid"><div><label for="level">压缩级别</label><select id="level"><option value="">默认</option><option value="0">仅存储</option><option value="1">快速</option><option value="5">标准</option><option value="9">最大</option></select></div><div><label for="threads">线程数（留空由引擎决定）</label><input id="threads" type="number" min="1" max="256"></div><div><label for="volume">分卷大小（MiB，留空不分卷）</label><input id="volume" type="number" min="1"></div><div><label for="codepage">旧格式文件名代码页（例如 936）</label><input id="codepage" type="number" min="1"></div></div></details>
<div id="hint"></div></fieldset><div id="runbar"><button class="primary" type="submit" id="run">执行</button><button type="button" id="cancel" disabled>取消任务</button><span id="status">就绪</span></div><progress id="progress" class="hidden" max="100"></progress></form><div id="result" aria-live="polite"></div>
<script>
const invoke=(window.__TAURI__||window.parent.__TAURI__).core.invoke,$=id=>document.getElementById(id),lines=id=>$(id).value.split(/\r?\n/).filter(s=>s.length>0);let active=null;
const show=(id,yes)=>$(id).classList.toggle('hidden',!yes);const fileOps=['list','extract','test','add','delete','rename','preview','repair','recover','scan','checksum'];
function update(){const op=$('operation').value,creating=op==='create',vault=op.startsWith('vault');show('path-group',fileOps.includes(op)||creating);$('path-label').textContent=creating?'新压缩包保存路径':op==='scan'?'待扫描文件路径':'压缩包路径';show('dest-group',['extract','repair'].includes(op));$('dest-label').textContent=op==='repair'?'修复后另存为（必须是新文件）':'解压到';show('inputs-group',['create','add','delete','rename'].includes(op));$('inputs-label').textContent=op==='rename'?'旧名称、新名称交替填写，每行一个（如：旧名.txt 换行 新名.txt）':op==='delete'?'要删除的包内完整名称（每行一个）':'输入文件（每行一个完整路径）';show('files',['create','add'].includes(op));show('folder',['create','add'].includes(op));show('format-group',creating);show('overwrite-group',op==='extract');show('selected-group',op==='extract');show('name-group',op==='preview'||['vault-put','vault-delete'].includes(op));$('name-label').textContent=vault?'密码 ID':'图片在包内的完整名称';show('label-group',op==='vault-put');show('password-group',!['capabilities','scan','checksum','recover','vault-list','vault-delete','shell-enable','shell-disable'].includes(op));show('password-id-group',!vault&&!['capabilities','scan','checksum','recover','shell-enable','shell-disable'].includes(op));show('recovery-group',op==='recover');show('advanced',!vault&&['list','extract','test','add','create','preview','delete','rename','repair'].includes(op));$('hint').textContent=op==='repair'?'修复仅恢复能验证的 ZIP 条目；原文件保留不变，不能保证恢复全部内容。':op==='recover'?'按候选顺序进行有上限的尝试；并非保证成功的密码破解。':op==='scan'?'调用本机 Windows Defender，禁用自动处置；服务不可用时会明确报告。':op==='shell-enable'?'仅增加当前用户的“使用 qing-zip 打开”右键入口，不修改默认打开方式。':creating?'新建操作不会覆盖已有压缩包。GZip、XZ、BZip2 单流格式只能直接输入一个文件。':'';}
$('operation').onchange=update;update();
$('browse').onclick=async()=>{if($('operation').value==='create'){$('path').value=await invoke('pick_archive_save',{format:$('format').value})||$('path').value;}else{const f=await invoke('pick_files');if(f.length)$('path').value=f[0];}};
$('browse-dest').onclick=async()=>{$('dest').value=await invoke($('operation').value==='repair'?'pick_save':'pick_folder')||$('dest').value;};
$('files').onclick=async()=>{const f=await invoke('pick_files_for_zip');if(f.length)$('inputs').value=[$('inputs').value,...f].filter(Boolean).join('\n');};
$('folder').onclick=async()=>{const p=await invoke('pick_folder');if(p)$('inputs').value=[$('inputs').value,p].filter(Boolean).join('\n');};
function text(content,tag='div'){const el=document.createElement(tag);el.textContent=content;$('result').append(el);return el;}
function render(op,result){$('result').replaceChildren();if(result.data_url){const img=document.createElement('img');img.id='preview';img.src=result.data_url;img.alt=result.name;$('result').append(img);return;}
if(Array.isArray(result.entries)){text(`${result.entries.length} 个条目`);const table=document.createElement('table');const head=document.createElement('tr');for(const s of ['名称','字节','加密','修改时间']){const h=document.createElement('th');h.textContent=s;head.append(h);}table.append(head);for(const e of result.entries){const tr=document.createElement('tr');for(const v of [e.name,e.is_dir?'目录':e.size,e.encrypted?'是':'否',e.modified]){const td=document.createElement('td');td.textContent=v;tr.append(td);}table.append(tr);}$('result').append(table);return;}
if(result.sha256){for(const k of ['crc32','md5','sha1','sha256'])text(k.toUpperCase()+': '+result[k]);}else if(result.valid)text('完整性检查通过。');else if(result.files!==undefined)text(`已解压 ${result.files} 个文件 → ${result.destination}`);else if(result.outputs)result.outputs.forEach(p=>text('已创建：'+p));else if(result.updated)text('已更新：'+result.updated);else if(result.recovered){text(`恢复 ${result.recovered.length} 项 → ${result.output}`);text(result.complete?'恢复完成。':'部分恢复；原包中的其他内容可能无法恢复。');result.skipped.forEach(s=>text('未恢复：'+s));}else if(op==='recover'){text(`已尝试 ${result.attempts} 次 · ${{found:'找到密码',exhausted:'候选已用尽',limit_reached:'达到尝试上限',cancelled:'已取消'}[result.status]||result.status}`);if(result.password!==null){const input=document.createElement('input');input.type='password';input.readOnly=true;input.value=result.password;input.className='secret';$('result').append(input);const b=text('显示 / 隐藏密码','button');b.type='button';b.onclick=()=>input.type=input.type==='password'?'text':'password';}}else if(op==='scan'){text(result.status==='no_threat_reported'?'扫描完成：未发现威胁。':'扫描未确认安全：'+result.status);if(result.exit_code!==undefined)text('扫描程序返回：'+result.exit_code);if(result.details)text(result.details);}else if(Array.isArray(result)){if(!result.length)text('没有保存的密码。');result.forEach(e=>text(`${e.id} · ${e.label}`));}else if(result.saved)text('密码已加密保存：'+result.saved);else if(result.removed)text('密码条目已删除：'+result.removed);else if(result.enabled!==undefined)text(result.enabled?'右键入口已启用。':'右键入口已移除。');else if(result.engine){text('可读取：'+result.engine.read_formats.join('、'));text('可创建：'+result.engine.write_formats.join('、'));text('引擎状态：'+(result.engine.available?'可用':'缺失'));result.engine.limitations.forEach(s=>text(s));}else text('操作完成。');}
$('cancel').onclick=async()=>{if(active!==null){await invoke('cancel_operation',{id:active});$('status').textContent='正在取消…';$('cancel').disabled=true;}};
$('form').onsubmit=async event=>{event.preventDefault();const op=$('operation').value;const options={};if(!$('password-group').classList.contains('hidden')&&$('password').value)options.password=$('password').value;if(!$('advanced').classList.contains('hidden')){for(const id of ['level','threads','codepage'])if($(id).value)options[id]=Number($(id).value);if($('volume').value)options.volume_bytes=Math.floor(Number($('volume').value)*1048576);}if(op==='extract'){options.selected=lines('selected');options.overwrite=$('overwrite').value;}const request={operation:op,path:$('path').value,dest:$('dest').value,format:$('format').value,inputs:lines('inputs'),options,name:$('name').value,label:$('label').value,smart:$('smart').checked,candidates:op==='recover'?lines('candidates'):[],max_attempts:Number($('max-attempts').value)||1000};if(!$('password-id-group').classList.contains('hidden')&&$('password-id').value)request.password_id=$('password-id').value;
if(op==='recover'&&$('charset').value){request.charset=$('charset').value;request.min_length=Number($('min-length').value);request.max_length=Number($('max-length').value);}
if(['delete','vault-delete','shell-enable','shell-disable'].includes(op)&&!confirm('确认执行“'+$('operation').selectedOptions[0].textContent+'”？'))return;
try{if(op.startsWith('shell-'))request.path=await invoke('current_executable');window.obzBusy=true;$('fields').disabled=true;$('run').disabled=true;$('result').replaceChildren();$('status').className='';$('status').textContent='开始处理…';show('progress',true);$('progress').removeAttribute('value');active=await invoke('start_operation',{request});$('cancel').disabled=!['list','extract','create','test','add','delete','rename','preview','recover','checksum'].includes(op);$('password').value='';$('candidates').value='';while(true){const s=await invoke('wait_operation',{id:active});if(s.progress.percent!==null)$('progress').value=s.progress.percent;else $('progress').removeAttribute('value');if(s.status!=='running'){if(s.status==='complete'){render(op,s.result);$('status').textContent='已完成';}else{throw new Error(s.error||'任务已取消');}break;}$('status').textContent=s.progress.percent!==null?`处理中 · ${s.progress.percent}%`:'处理中…';}}catch(err){$('status').textContent=String(err);$('status').className='error';}finally{if(active!==null){await invoke('forget_operation',{id:active}).catch(()=>{});active=null;}window.obzBusy=false;$('fields').disabled=false;$('run').disabled=false;$('cancel').disabled=true;show('progress',false);}};
document.documentElement.style.colorScheme=window.parent!==window?window.parent.document.getElementById('qing-archive').style.colorScheme:'light';
const params=new URLSearchParams(location.search);if(params.has('operation'))$('operation').value=params.get('operation');if(params.has('path'))$('path').value=params.get('path');if(params.has('codepage'))$('codepage').value=params.get('codepage');update();
if(window.parent!==window){document.querySelector('h1').hidden=true;document.querySelector('body>p').hidden=true;document.body.style.padding='12px';}
</script></body></html>
