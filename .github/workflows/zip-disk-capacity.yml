name: Disposable Windows ZIP disk capacity
on:
  pull_request:
    paths:
      - 'scripts/check-hosted-zip-capacity.py'
      - 'scripts/zip_working_space.py'
      - 'scripts/nested_save_capacity.py'
      - 'scripts/check-hosted-zip-capacity.ps1'
      - '.github/workflows/zip-disk-capacity.yml'
  workflow_dispatch:
    inputs:
      trial:
        description: Select historical, final package, or incomplete-write acceptance
        type: choice
        options: [historical, round2, midwrite, update, nested, nested-feedback]
        default: historical
      baseline_build_run:
        description: Replacement hardened run for the pinned baseline source
        type: string
        required: false
      combined_build_run:
        description: Replacement hardened run for the pinned combined source
        type: string
        required: false
      round2_build_run:
        description: Replacement hardened run for the pinned round-two source
        type: string
        required: false
      candidate_build_run:
        description: Optional same-repository Windows regression run for nested-feedback
        type: string
        required: false
      candidate_source:
        description: Exact product commit of the replacement nested-feedback run
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  real-disk-capacity:
    if: github.repository == 'qing-yi-5427/qing-zip' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        trial: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '["baseline","combined","update"]' ||
                      inputs.trial == 'historical' && '["baseline","combined"]' ||
                      format('["{0}"]', inputs.trial)) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install WebView2 test transport for nested archive acceptance
        if: startsWith(matrix.trial, 'nested')
        run: python -m pip install playwright==1.56.0
      - name: Verify isolated VHD and run the selected ZIP operations
        shell: pwsh
        env:
          TRIAL: ${{ matrix.trial }}
          BASELINE_RUN: ${{ inputs.baseline_build_run }}
          COMBINED_RUN: ${{ inputs.combined_build_run }}
          ROUND2_RUN: ${{ inputs.round2_build_run }}
          CANDIDATE_RUN: ${{ inputs.candidate_build_run }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRun = switch ($env:TRIAL) {
            'baseline' { $env:BASELINE_RUN }
            'combined' { $env:COMBINED_RUN }
            'round2' { $env:ROUND2_RUN }
            'midwrite' { $env:ROUND2_RUN }
            'update' { $env:ROUND2_RUN }
            'nested' { $env:ROUND2_RUN }
            'nested-feedback' { $env:CANDIDATE_RUN }
          }
          if ($env:TRIAL -eq 'nested-feedback' -and ($env:CANDIDATE_RUN -or $env:CANDIDATE_SOURCE)) {
            if (!$buildRun -or !$env:CANDIDATE_SOURCE) { throw 'Specify both the candidate run and its exact product commit' }
            ./scripts/check-hosted-zip-capacity.ps1 -Trial $env:TRIAL -BuildRun $buildRun -CandidateSource $env:CANDIDATE_SOURCE
          }
          elseif ($buildRun) { ./scripts/check-hosted-zip-capacity.ps1 -Trial $env:TRIAL -BuildRun $buildRun }
          else { ./scripts/check-hosted-zip-capacity.ps1 -Trial $env:TRIAL }
      - name: Upload product, volume and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zip-disk-capacity-${{ matrix.trial }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/qz-capacity-*/evidence/*.json
            ${{ runner.temp }}/qz-capacity-*/evidence/*.png
