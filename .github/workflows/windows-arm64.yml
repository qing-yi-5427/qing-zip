name: Windows ARM64 native validation
on:
  push:
    branches: [main, codex/nanazip-parity, codex/arm64-engine-validation]
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_scale_probe:
        description: 'Read hosted Windows display settings and session availability without changing settings'
        type: boolean
        required: false
        default: false
      round2_fluent_capture:
        description: 'Capture native accessibility states against a verified ARM64 portable package'
        type: boolean
        required: false
        default: false
      capture_build_run:
        description: 'Optional successful same-repository ARM64 workflow run'
        type: string
        required: false
      capture_source:
        description: 'Exact revision for the optional build'
        type: string
        required: false
      capture_package_sha:
        description: 'SHA-256 of the expected ARM64 portable ZIP for the optional build'
        type: string
        required: false
      capture_system_scale:
        description: 'Use the standard Windows Display Scale list for a native 200% test'
        type: boolean
        required: false
        default: false
      run_installer_upgrade:
        description: 'Upgrade the pinned official ARM64 installer in a fresh temporary location and verify user files after uninstall'
        type: boolean
        default: false
      run_deep_tests:
        description: 'Run native filesystem, link, ADS and failure-path regressions on an explicitly approved disposable runner'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  native:
    if: github.event_name != 'workflow_dispatch' || (!inputs.round2_fluent_capture && !inputs.hosted_scale_probe)
    runs-on: windows-11-arm
    timeout-minutes: 55
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.99.0-aarch64-pc-windows-msvc
      CARGO_TARGET_DIR: target/arm-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Confirm ARM64 machine and install the native compiler
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64' -or [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'A native Windows ARM64 runner is required'
          }
          if (!(Get-Command rustup -ErrorAction SilentlyContinue)) {
            $path = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/archive/1.29.1/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile $path
            if ((Get-FileHash $path).Hash -ne '01aa49cf9574a8bd0ae52005d7de2590e8f27181ded6748236e702c92aef826d') { throw 'rustup digest mismatch' }
            & $path -y --no-modify-path --default-host aarch64-pc-windows-msvc --default-toolchain none
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $cargoBin = Join-Path $env:USERPROFILE '.cargo/bin'
            $cargoBin >> $env:GITHUB_PATH
            $env:PATH = "$cargoBin;$env:PATH"
          }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (rustc -vV | Out-String)
          $version
          if ($version -notmatch 'host: aarch64-pc-windows-msvc') { throw 'compiler is not native ARM64' }
      - name: Verify and stage the upstream ARM64 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content obz-rs/native/nana/provenance-arm64.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'nanazip-binaries.zip'
          try {
            Invoke-WebRequest $manifest.package_url -OutFile $archive -MaximumRetryCount 2 -RetryIntervalSec 3 -ErrorAction Stop
          } catch {
            $name = ([Uri]$manifest.package_url).Segments[-1]
            gh release download $manifest.version --repo M2Team/NanaZip --pattern $name --output $archive --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python scripts/prepare-arm64-runtime.py $archive runtime/nanazip-arm64
          exit $LASTEXITCODE
      - name: Build architecture-matched supporting runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'qing-arm64-runtime'
          $cache = Join-Path $env:RUNNER_TEMP 'qing-arm64-downloads'
          ./scripts/build-arm64-helpers.cmd $runtime $cache
          exit $LASTEXITCODE
      - name: Selected pure frontend regressions
        shell: pwsh
        run: |
          node --test obz-gui/tests/archive-columns.cjs obz-gui/tests/archive-properties.cjs obz-gui/tests/archive-metadata.cjs obz-gui/tests/archive-row-window.cjs obz-gui/tests/folder-projection.cjs obz-gui/tests/archive-tab-focus.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-native-menu-accessibility.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-arm64-package-only.py
          exit $LASTEXITCODE
      - name: Selected pure listing and serialization regressions
        shell: pwsh
        run: |
          $tests = @(
            'engine::staging_tests::technical_listing_preserves_mixed_line_endings_and_metadata',
            'engine::staging_tests::technical_listing_rejects_ambiguous_and_unsafe_records',
            'engine::staging_tests::technical_listing_created_accessed_and_legacy_payload',
            'operations::tests::listing_response_matches_legacy_json_including_key_order',
            'engine::selected_worker::zip_listing::tests::zip_member_times_distinct_values_and_precision',
            'engine::selected_worker::zip_listing::tests::zip_member_times_absent_values_stay_empty',
            'engine::selected_worker::zip_listing::tests::zip_member_times_reject_wrong_types_counts_and_existing_unsafe_metadata',
            'engine::selected_worker::zip_listing::tests::zip_member_times_protocol_v2_is_synchronized_and_rejects_v1',
            'engine::parent_round_robin_preserves_every_index_and_parent_order',
            'engine::rar15_stored::tests::ordinary_volume_headers_share_one_metadata_budget',
            'engine::parent_round_robin_requires_owned_direct_memory_error_publication'
          )
          foreach ($testName in $tests) {
            $result = (cargo test --locked --manifest-path obz-rs/Cargo.toml --lib $testName -- --exact --nocapture 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Output $result
            if ($code) { exit $code }
            if ($result -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw "Expected exactly one passing pure test: $testName" }
          }
      - name: Classic stored RAR volume verification and extraction
        shell: pwsh
        run: |
          $testName = 'cli_classic_stored_rar_volumes_are_verified_before_publication'
          $result = (cargo test --locked --manifest-path obz-rs/Cargo.toml --test operations_integration $testName -- --exact 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $result
          if ($code) { exit $code }
          if ($result -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw "Expected exactly one passing RAR test: $testName" }
      - name: Ordinary archive selection, update and retry
        shell: pwsh
        run: |
          $tests = @(
            'engine::zip_input_probe::tests::classic_zip_with_exactly_65535_members_qualifies_for_verified_selection',
            'engine::owned_update::tests::ordinary_zip_cancel_reaps_its_bound_engine_before_returning',
            'engine::owned_update::tests::selected_tar_integrity_check_uses_its_owning_job',
            'engine::edit_source::tests::disposable_zip_candidate_reclaims_only_its_new_file',
            'engine::update_modes_tests::reject_unreadable_zip_rename_proposal_and_keep_original'
          )
          foreach ($testName in $tests) {
            $result = (cargo test --locked --manifest-path obz-rs/Cargo.toml --lib $testName -- --exact 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Output $result
            if ($code) { exit $code }
            if ($result -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw "Expected exactly one passing archive lifecycle test: $testName" }
          }
      - name: Native CLI, policy and verified split extraction
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          cargo build --locked --manifest-path obz-rs/Cargo.toml --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path obz-rs/Cargo.toml --lib machine_policy::tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path obz-rs/Cargo.toml --lib verification_lease::tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $listed = (cargo test --locked --manifest-path obz-rs/Cargo.toml --test encrypted_split_selection --test engine_staging -- --list | Out-String)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($test in 'encrypted_split_selection_checks_unselected_blocks_before_publication','split_lzma2_verifies_all_blocks_and_rejects_unselected_crc','selected_split_commits_only_verified_files_on_the_target_volume') {
            if (!$listed.Contains($test)) { throw "missing native regression: $test" }
          }
          cargo test --locked --manifest-path obz-rs/Cargo.toml --test encrypted_split_selection --test engine_staging --test verified_zip_create --test verified_7z_create -- --nocapture
          exit $LASTEXITCODE
      - name: Native read-only ADS metadata regressions
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          $listed = (cargo test --locked --manifest-path obz-rs/Cargo.toml --lib engine::file_workspace::stream_inventory::tests -- --list | Out-String)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($test in 'parser_rejects_malformed_and_unbounded_records','metadata_only_inventory_covers_file_directory_empty_unicode_and_releases_pins','rejects_stream_paths_namespaces_and_reparse_without_disrupting_writers','attributes_permission_is_required_but_payload_read_permission_is_not') {
            if (!$listed.Contains($test)) { throw "missing native ADS regression: $test" }
          }
          cargo test --locked --manifest-path obz-rs/Cargo.toml --lib engine::file_workspace::stream_inventory::tests -- --nocapture
          exit $LASTEXITCODE
      - name: Require native ARM64 local symbolic-link creation and existing-link editing
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          $tests = @(
            'engine::file_workspace::links::tests::require_symbolic_file_and_directory_success',
            'engine::file_workspace::links::edit::tests::require_symbolic_inspect_edit_clear_success'
          )
          foreach ($test in $tests) {
            $listed = (cargo test --locked --manifest-path obz-rs/Cargo.toml --lib $test -- --ignored --list | Out-String)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if (!$listed.Contains("${test}: test")) { throw "missing required symbolic-link acceptance: $test" }
            cargo test --locked --manifest-path obz-rs/Cargo.toml --lib $test -- --ignored --exact --nocapture
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          exit 0
      - name: Check native ARM64 ZIP creation and real file symbolic links
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          python scripts/check-zip-create-worker.py --cli target/arm-validation/debug/obz.exe --console runtime/nanazip-arm64/NanaZip.Universal.Console.exe --require-file-symlink
          exit $LASTEXITCODE
      - name: Build native desktop and verify all authored executables
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          cargo build --locked --manifest-path obz-gui/Cargo.toml --bin obz-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path obz-gui/Cargo.toml --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/check-arm64-layout.ps1 -Cli target/arm-validation/debug/obz.exe -Desktop target/arm-validation/debug/obz-gui.exe -Layout (Join-Path $env:RUNNER_TEMP 'qing-arm64-layout')
          exit $LASTEXITCODE
      - name: Build hardened ARM64 portable package
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw obz-gui/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          $build = ./scripts/build-hardened.ps1 -Target aarch64-pc-windows-msvc -TargetDirectory (Join-Path $env:RUNNER_TEMP 'qing-arm64-hardened')
          python scripts/package.py --architecture arm64 --runtime-directory (Join-Path $env:RUNNER_TEMP 'qing-arm64-runtime') --binary-directory $build.BinaryDirectory --output-directory dist/arm64
          exit $LASTEXITCODE
      - name: Interrupt an ordinary ZIP add and verify the original and retry
        shell: pwsh
        run: |
          $cli = @(Get-ChildItem -LiteralPath dist/arm64 -Recurse -File -Filter obz.exe)
          if ($cli.Count -ne 1) { throw 'Expected one packaged CLI' }
          python -m pip install --disable-pip-version-check psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-interrupted-archive-update.py --cli $cli[0].FullName --action add --require-owned --require-reclaimed --out (Join-Path $env:RUNNER_TEMP 'zip-add-interruption.jsonl')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-verifier-exit.py --cli $cli[0].FullName --out (Join-Path $env:RUNNER_TEMP 'zip-verifier-exit.json')
          exit $LASTEXITCODE
      - name: Save ordinary ZIP add interruption trials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-zip-add-interruption
          path: |
            ${{ runner.temp }}/zip-add-interruption.jsonl
            ${{ runner.temp }}/zip-verifier-exit.json
          if-no-files-found: warn
      - name: Verify packaged native ZIP cache and cancellation
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem -LiteralPath dist/arm64 -Filter '*-portable.zip' -File)
          if ($portable.Count -ne 1) { throw 'Expected exactly one ARM64 portable archive' }
          ./scripts/check-selected-zip-cache.ps1 -Portable $portable[0].FullName -Target aarch64-pc-windows-msvc `
            -TargetDirectory (Join-Path $env:RUNNER_TEMP 'qing-arm64-hardened')
      - name: Verify the running ARM64 menu against native desktop accessibility settings
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websockets==15.0.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = @(Get-ChildItem -LiteralPath dist/arm64 -Recurse -File -Filter qing-zip.exe)
          if ($exe.Count -ne 1) { throw 'Expected one packaged ARM64 GUI' }
          python scripts/fluent-menu-evidence.py --exe $exe[0].FullName --out evidence/native-menu --native-accessibility
          exit $LASTEXITCODE
      - name: Preserve native settings, menu screenshots and observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-arm64-menu
          path: evidence/native-menu/
          if-no-files-found: warn
          retention-days: 14
      - name: Invoke the classic Explorer action on native ARM64
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          cmake -S qing-shell -B target/qing-shell-arm -A ARM64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build target/qing-shell-arm --config Release --target qing-shell-classic-forwarding
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_classic_shell.py dist/arm64 target/qing-shell-arm/Release/qing-shell-classic-forwarding.exe
          exit $LASTEXITCODE
      - name: Build ARM64 installer without running it
        if: github.event_name != 'workflow_dispatch' || !inputs.run_deep_tests
        shell: pwsh
        run: |
          python scripts/check-arm64-package.py dist/arm64 (Join-Path $env:RUNNER_TEMP 'qing-arm64-downloads') --package-only
          exit $LASTEXITCODE
      - name: Install, exercise helpers, and uninstall on ARM64
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          python scripts/check-arm64-package.py dist/arm64 (Join-Path $env:RUNNER_TEMP 'qing-arm64-downloads')
          exit $LASTEXITCODE
      - name: Upgrade the previous official ARM64 release in its registered directory
        if: github.event_name != 'workflow_dispatch' || inputs.run_installer_upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $inputsDir = Join-Path $env:RUNNER_TEMP 'qing-arm64-upgrade-inputs'
          New-Item -ItemType Directory -Path $inputsDir | Out-Null
          gh release download v0.11.27 -R qing-yi-5427/qing-zip --pattern 'qing-zip-0.11.27-arm64-setup.exe' --pattern 'qing-zip-0.11.27-arm64-portable.zip' --dir $inputsDir
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $candidate = "dist/arm64/qing-zip-$env:VERSION-arm64"
          python scripts/check-nsis-upgrade-hosted.py --arch ARM64 --old-setup (Join-Path $inputsDir 'qing-zip-0.11.27-arm64-setup.exe') --old-portable (Join-Path $inputsDir 'qing-zip-0.11.27-arm64-portable.zip') --candidate-setup "$candidate-setup.exe" --candidate-stage "$candidate-portable" --out evidence/arm64-upgrade
          exit $LASTEXITCODE
      - name: Save ARM64 upgrade and uninstall receipt
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_installer_upgrade)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-release-upgrade
          path: evidence/arm64-upgrade/receipt.json
          if-no-files-found: warn
      - name: Package engine sources
        shell: pwsh
        run: |
          python scripts/package-engine-sources.py --arm64-runtime (Join-Path $env:RUNNER_TEMP 'qing-arm64-runtime') --output-directory dist/arm64 --source-cache (Join-Path $env:RUNNER_TEMP 'qing-arm64-downloads')
          exit $LASTEXITCODE
      - name: Upload verified trial packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qing-zip-${{ steps.package.outputs.version }}-windows-arm64-trial
          if-no-files-found: error
          retention-days: 21
          path: |
            dist/arm64/*.zip
            dist/arm64/*.exe
            dist/arm64/*.sha256
            dist/arm64/*-verification.json
            dist/arm64/*-package-build.json

  round2-fluent-capture:
    if: github.repository == 'qing-yi-5427/qing-zip' && github.event_name == 'workflow_dispatch' && inputs.round2_fluent_capture && !inputs.hosted_scale_probe
    runs-on: windows-11-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify pinned package and capture native desktop states
        shell: pwsh
        env:
          CAPTURE_BUILD: ${{ inputs.capture_build_run }}
          CAPTURE_SOURCE: ${{ inputs.capture_source }}
          CAPTURE_PACKAGE: ${{ inputs.capture_package_sha }}
          CAPTURE_SYSTEM_SCALE: ${{ inputs.capture_system_scale }}
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64' -or [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'Native ARM64 required' }
          $specified = @(@($env:CAPTURE_BUILD, $env:CAPTURE_SOURCE, $env:CAPTURE_PACKAGE) | Where-Object { $_ })
          $build = '45119972417'
          $source = 'b2bf9f3f4eaddcbfefd3144ad0fdb8769fa1824b'
          $expectedPackage = '39b494dcbff1b3afa20b4c85bcb0ddb4de5da017fcee3c056593daab038fc10e'
          if ($specified.Count) {
            if ($env:CAPTURE_BUILD -cnotmatch '^[1-9][0-9]*$' -or $env:CAPTURE_SOURCE -cnotmatch '^[0-9a-f]{40}$' -or $env:CAPTURE_PACKAGE -cnotmatch '^[0-9a-f]{64}$') { throw 'Supply the build run, exact source SHA and portable SHA-256 together' }
            $build, $source, $expectedPackage = $env:CAPTURE_BUILD, $env:CAPTURE_SOURCE, $env:CAPTURE_PACKAGE
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$build" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.head_sha -cne $source -or $run.conclusion -cne 'success' -or $run.path -cne '.github/workflows/windows-arm64.yml' -or $run.event -notin @('push','workflow_dispatch')) { throw 'Pinned build provenance mismatch' }
          $artifact = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$build/artifacts" | ConvertFrom-Json | ForEach-Object artifacts | Where-Object { $_.name -cmatch '^qing-zip-[0-9]+\.[0-9]+\.[0-9]+-windows-arm64-trial$' -and !$_.expired })
          if ($LASTEXITCODE -or $artifact.Count -ne 1 -or $artifact[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing single source-bound ARM64 artifact' }
          if (!$specified.Count -and $artifact[0].digest -cne 'sha256:eaa7d974800ae0e37204ea2d3d98c4c000d98a95fe33e7435d4eaf75a77a8ad4') { throw 'Historical artifact mismatch' }
          gh run download $build --repo $env:GITHUB_REPOSITORY --name $artifact[0].name --dir downloaded
          if ($LASTEXITCODE) { throw 'Artifact download failed' }
          $package = @(Get-ChildItem downloaded -Recurse -File -Filter '*-arm64-portable.zip')
          if ($package.Count -ne 1 -or (Get-FileHash -LiteralPath $package[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedPackage) { throw 'Pinned portable SHA-256 mismatch' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          @{ source = $run.head_sha; run = $run.id; artifact_id = $artifact[0].id; artifact_digest = $artifact[0].digest; package_sha256 = (Get-FileHash -LiteralPath $package[0].FullName).Hash.ToLowerInvariant(); harness = (git rev-parse HEAD).Trim(); runner_arch = $env:RUNNER_ARCH } | ConvertTo-Json | Set-Content -Encoding utf8 evidence/package.json
          Expand-Archive -LiteralPath $package[0].FullName -DestinationPath staged
          $exe = @(Get-ChildItem staged -Recurse -File -Filter qing-zip.exe)
          if ($exe.Count -ne 1) { throw 'Expected exactly one GUI' }
          python -m pip install --disable-pip-version-check websockets==15.0.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $check = if ($env:CAPTURE_SYSTEM_SCALE -eq 'true') { '--native-system-scale' } else { '--native-accessibility' }
          python scripts/fluent-menu-evidence.py --exe $exe[0].FullName --out evidence/native-menu $check
          exit $LASTEXITCODE
      - name: Preserve package binding and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: round2-arm64-fluent-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  hosted-display-probe:
    if: github.repository == 'qing-yi-5427/qing-zip' && github.event_name == 'workflow_dispatch' && inputs.hosted_scale_probe
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read actual display scale options on disposable Windows host
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_ARCH -notin @('X64','ARM64')) { throw 'Disposable hosted Windows required' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          $os=Get-CimInstance Win32_OperatingSystem
          @{ name=$os.Caption; version=$os.Version; arch=$env:RUNNER_ARCH; session=$env:SESSIONNAME; source=(git rev-parse HEAD).Trim() } | ConvertTo-Json | Set-Content -Encoding utf8 evidence/host.json
          & powershell.exe -NoProfile -File scripts/display-scale-settings.ps1 -Receipt evidence/settings.json -Screenshot evidence/settings.png -SelectPercent 0
          if ($LASTEXITCODE) { throw 'Settings probe process failed' }
          & ./scripts/probe-custom-scale.ps1 -Receipt evidence/custom-page.json
          $result=Get-Content evidence/settings.json -Raw | ConvertFrom-Json
          $custom=Get-Content evidence/custom-page.json -Raw | ConvertFrom-Json
          if ($result.error -or $custom.status -cne 'observed' -or !$custom.navigation_invoked -or !$custom.custom_page_observed) { throw 'Native settings or custom page not observable; inspect receipt' }
      - name: Preserve read-only host findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-display-probe-${{ matrix.runner }}
          path: evidence/
          retention-days: 30
