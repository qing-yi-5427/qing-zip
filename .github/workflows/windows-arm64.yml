name: Disposable Windows 11 Explorer and sparse MSIX
on: workflow_dispatch
permissions: { contents: read, actions: read }
jobs:
  menu:
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      PYTHONUTF8: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build actual ARM64 shell extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory results
          Get-ComputerInfo | Select-Object WindowsProductName,OsName,OsBuildNumber,OsArchitecture | ConvertTo-Json | Set-Content results/os.json
          qwinsta | Out-File results/session.txt
          ./scripts/msix/Build-Component.ps1 -Architecture ARM64
      - name: Fetch matching qing-zip GUI, isolated certificate, sparse registration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'ARM64') { throw 'Disposable hosted Windows ARM64 required' }
          $run=42456912207
          gh run watch $run --interval 30 --exit-status
          if ($LASTEXITCODE) { throw 'Upstream native package did not pass' }
          $source = gh run view $run --json headSha,url | ConvertFrom-Json
          if ($source.headSha -ne '336be6e2499621934c94f3539c640917ce66b89d') { throw 'Unexpected code revision' }
          $source | ConvertTo-Json | Set-Content results/app-source.json
          gh run download $run --name 'qing-zip-0.11.7-windows-arm64-trial' --dir incoming
          if ($LASTEXITCODE) { throw 'Package download failed' }
          $archive = @(Get-ChildItem incoming -Filter '*-portable.zip' -Recurse)
          if ($archive.Count -ne 1) { throw 'No unique ARM64 portable distribution' }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath app
          $app = @(Get-ChildItem app -Recurse -Filter qing-zip.exe)[0]
          $sdk = @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending)[0].Directory
          $publisher="CN=QingZip Disposable Menu Run $env:GITHUB_RUN_ID"
          & ./scripts/msix/Prepare-Package.ps1 -ComponentDirectory target/qing-shell/Release -OutputDirectory prepared -Publisher $publisher -Version 0.11.7.0 -Architecture arm64 -MakeAppxPath (Join-Path $sdk makeappx.exe) -ManifestToolPath (Join-Path $sdk mt.exe)
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -KeyExportPolicy NonExportable -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddHours(8)
          $cert.Thumbprint | Set-Content "$env:RUNNER_TEMP\qing-menu-thumb.txt"
          $public=Join-Path $env:RUNNER_TEMP 'qing-disposable-public.cer'
          Export-Certificate -Cert $cert -FilePath $public | Out-Null
          foreach ($store in @('Cert:\LocalMachine\Root','Cert:\LocalMachine\TrustedPeople')) { Import-Certificate -FilePath $public -CertStoreLocation $store | Out-Null }
          $package=@(Get-ChildItem prepared -Filter '*.msix')[0]
          # This disposable 8-hour test key and package never leave the runner.
          # The shipping signing policy remains unchanged.
          $signTool=Join-Path $sdk signtool.exe
          & $signTool sign /sha1 $cert.Thumbprint /fd SHA256 $package.FullName
          if ($LASTEXITCODE) { throw 'Disposable local package signature failed' }
          & $signTool verify /pa /v $package.FullName | Out-File results/test-signature.txt
          if ($LASTEXITCODE) { throw 'Disposable signature did not verify' }
          $external=Join-Path $app.DirectoryName shell
          Copy-Item -LiteralPath prepared/shell -Destination $external -Recurse
          & ./scripts/msix/Register-Package.ps1 -PackagePath $package.FullName -ExternalLocation $external -Publisher $publisher -SignToolPath (Join-Path $sdk signtool.exe)
          Get-AppxPackage 'QingYi.QingZip.Shell' | Select-Object Name,PackageFullName,Publisher,Status | ConvertTo-Json | Set-Content results/registration.json
          $app.FullName | Set-Content "$env:RUNNER_TEMP\qing-menu-exe.txt"
      - name: Observe actual Explorer context menus and invoke operations
        shell: pwsh
        run: |
          python -m pip install pywinauto==0.6.9 pillow==11.3.0 websockets==15.0.1
          if ($LASTEXITCODE) { throw 'Desktop probes unavailable' }
          python scripts/msix/check-hosted-explorer.py (Get-Content "$env:RUNNER_TEMP\qing-menu-exe.txt") results
          exit $LASTEXITCODE
      - name: Remove only the test registration and disposable certificates
        if: always()
        shell: powershell
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Unexpected host' }
          $publisher="CN=QingZip Disposable Menu Run $env:GITHUB_RUN_ID"
          ./scripts/msix/Unregister-Package.ps1 -Publisher $publisher
          $receipt="$env:RUNNER_TEMP\qing-menu-thumb.txt"
          if (Test-Path $receipt) {
            $t=(Get-Content $receipt).Trim()
            if ($t -notmatch '^[0-9a-f]{40}$') { throw 'Unexpected thumbprint' }
            foreach ($store in @('Cert:\LocalMachine\Root','Cert:\LocalMachine\TrustedPeople','Cert:\CurrentUser\My')) {
              $entry=Join-Path $store $t
              if (Test-Path -LiteralPath $entry) {
                if ((Get-Item -LiteralPath $entry).Subject -ne $publisher) { throw 'Refuse unrelated certificate' }
                if ($store -eq 'Cert:\CurrentUser\My') { Remove-Item -LiteralPath $entry -DeleteKey } else { Remove-Item -LiteralPath $entry }
              }
            }
          }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modern-explorer-public-evidence
          path: |
            results/*.json
            results/*.txt
            results/*.png
