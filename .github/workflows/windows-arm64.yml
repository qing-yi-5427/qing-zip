name: Windows ARM64 native validation
on:
  push:
    branches: [main, codex/nanazip-parity, codex/arm64-engine-validation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 55
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.99.0-aarch64-pc-windows-msvc
      CARGO_TARGET_DIR: target/arm-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Confirm ARM64 machine and install the native compiler
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64' -or [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'A native Windows ARM64 runner is required'
          }
          if (!(Get-Command rustup -ErrorAction SilentlyContinue)) {
            $path = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/archive/1.29.1/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile $path
            if ((Get-FileHash $path).Hash -ne '01aa49cf9574a8bd0ae52005d7de2590e8f27181ded6748236e702c92aef826d') { throw 'rustup digest mismatch' }
            & $path -y --no-modify-path --default-host aarch64-pc-windows-msvc --default-toolchain none
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $cargoBin = Join-Path $env:USERPROFILE '.cargo/bin'
            $cargoBin >> $env:GITHUB_PATH
            $env:PATH = "$cargoBin;$env:PATH"
          }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (rustc -vV | Out-String)
          $version
          if ($version -notmatch 'host: aarch64-pc-windows-msvc') { throw 'compiler is not native ARM64' }
      - name: Verify and stage the upstream ARM64 runtime
        shell: pwsh
        run: |
          $manifest = Get-Content obz-rs/native/nana/provenance-arm64.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'nanazip-binaries.zip'
          Invoke-WebRequest $manifest.package_url -OutFile $archive
          python scripts/prepare-arm64-runtime.py $archive runtime/nanazip-arm64
          exit $LASTEXITCODE
      - name: Build architecture-matched supporting runtimes
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'qing-arm64-runtime'
          $cache = Join-Path $env:RUNNER_TEMP 'qing-arm64-downloads'
          ./scripts/build-arm64-helpers.cmd $runtime $cache
          exit $LASTEXITCODE
      - name: Native CLI, policy and verified split extraction
        shell: pwsh
        run: |
          cargo build --locked --manifest-path obz-rs/Cargo.toml --bin obz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path obz-rs/Cargo.toml --lib machine_policy::tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $listed = (cargo test --locked --manifest-path obz-rs/Cargo.toml --test encrypted_split_selection --test engine_staging -- --list | Out-String)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($test in 'encrypted_split_selection_checks_unselected_blocks_before_publication','split_lzma2_verifies_all_blocks_and_rejects_unselected_crc','selected_split_commits_only_verified_files_on_the_target_volume') {
            if (!$listed.Contains($test)) { throw "missing native regression: $test" }
          }
          cargo test --locked --manifest-path obz-rs/Cargo.toml --test encrypted_split_selection --test engine_staging --test verified_zip_create -- --nocapture
          exit $LASTEXITCODE
      - name: Check native ARM64 ZIP creation and real file symbolic links
        shell: pwsh
        run: |
          python scripts/check-zip-create-worker.py --cli target/arm-validation/debug/obz.exe --console runtime/nanazip-arm64/NanaZip.Universal.Console.exe --require-file-symlink
          exit $LASTEXITCODE
      - name: Build native desktop and verify both authored executables
        shell: pwsh
        run: |
          cargo build --locked --manifest-path obz-gui/Cargo.toml --bin obz-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path obz-gui/Cargo.toml --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/check-arm64-layout.ps1 -Cli target/arm-validation/debug/obz.exe -Desktop target/arm-validation/debug/obz-gui.exe -Layout (Join-Path $env:RUNNER_TEMP 'qing-arm64-layout')
          exit $LASTEXITCODE
      - name: Build hardened ARM64 portable package
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw obz-gui/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          $build = ./scripts/build-hardened.ps1 -Target aarch64-pc-windows-msvc -TargetDirectory (Join-Path $env:RUNNER_TEMP 'qing-arm64-hardened')
          python scripts/package.py --architecture arm64 --runtime-directory (Join-Path $env:RUNNER_TEMP 'qing-arm64-runtime') --binary-directory $build.BinaryDirectory --output-directory dist/arm64
          exit $LASTEXITCODE
      - name: Invoke the classic Explorer action on native ARM64
        shell: pwsh
        run: |
          cmake -S qing-shell -B target/qing-shell-arm -A ARM64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build target/qing-shell-arm --config Release --target qing-shell-classic-forwarding
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_classic_shell.py dist/arm64 target/qing-shell-arm/Release/qing-shell-classic-forwarding.exe
          exit $LASTEXITCODE
      - name: Install, exercise helpers, and uninstall on ARM64
        shell: pwsh
        run: |
          python scripts/check-arm64-package.py dist/arm64 (Join-Path $env:RUNNER_TEMP 'qing-arm64-downloads')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/package-engine-sources.py --arm64-runtime (Join-Path $env:RUNNER_TEMP 'qing-arm64-runtime') --output-directory dist/arm64
          exit $LASTEXITCODE
      - name: Upload verified trial packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qing-zip-${{ steps.package.outputs.version }}-windows-arm64-trial
          if-no-files-found: error
          retention-days: 21
          path: |
            dist/arm64/*.zip
            dist/arm64/*.exe
            dist/arm64/*.sha256
            dist/arm64/*-verification.json
