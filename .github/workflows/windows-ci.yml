name: Windows regression
on:
  push:
    branches: [main, codex/nanazip-parity]
  pull_request:
  workflow_dispatch:
    inputs:
      nested_restart_capture:
        description: 'Capture nested archive restart behavior using the pinned R3 package'
        type: boolean
        default: false
      nested_product_run:
        description: 'Pinned successful Windows regression build run'
        type: string
        default: '45128040411'
      nested_product_source:
        description: 'Full product source commit SHA'
        type: string
        default: 'fa5ecd5de3c3826a5422a54c3bbc8f038481f6d6'
      nested_package_sha256:
        description: 'Expected portable ZIP SHA-256'
        type: string
        default: 'b09d5089eaa0e8bcb5f376598c03be99e5773a716f008e17d49f696450bee6d5'
      nested_double_edit:
        description: 'Only verify recovery of the second successive inner edit'
        type: boolean
        default: false
      nested_large_fixture:
        description: 'Use one 64 MiB stored inner ZIP member in each ordinary scenario'
        type: boolean
        default: false
      nested_expect_recovery:
        description: 'Require recovery list, Save As and second-restart verification'
        type: boolean
        default: false
      run_deep_tests:
        description: 'Run native filesystem, link, ADS and failure-path regressions on an explicitly approved disposable runner'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  public-regressions:
    if: github.event_name != 'workflow_dispatch' || !inputs.nested_restart_capture
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Runtime provenance and frontend regressions
        shell: pwsh
        run: |
          python scripts/verify-runtime.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-runtime-inventory.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check obz-gui/frontend/app.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check obz-gui/frontend/tools.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check obz-gui/frontend/compression-options.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check obz-gui/frontend/deep-extract.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $frontendTests = @(Get-ChildItem obz-gui/tests -Filter *.cjs -File | Sort-Object Name | ForEach-Object FullName)
          node --test @frontendTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-native-menu-accessibility.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-arm64-package-only.py
          exit $LASTEXITCODE
      - name: Archive update, encryption, filename and nested write-back regressions
        shell: pwsh
        run: ./scripts/check-daily-archive-regressions.ps1
      - name: Selected pure listing and serialization regressions
        shell: pwsh
        run: |
          $tests = @(
            'engine::staging_tests::technical_listing_preserves_mixed_line_endings_and_metadata',
            'engine::staging_tests::technical_listing_rejects_ambiguous_and_unsafe_records',
            'engine::staging_tests::technical_listing_created_accessed_and_legacy_payload',
            'operations::tests::listing_response_matches_legacy_json_including_key_order',
            'engine::selected_worker::zip_listing::tests::zip_member_times_distinct_values_and_precision',
            'engine::selected_worker::zip_listing::tests::zip_member_times_absent_values_stay_empty',
            'engine::selected_worker::zip_listing::tests::zip_member_times_reject_wrong_types_counts_and_existing_unsafe_metadata',
            'engine::selected_worker::zip_listing::tests::zip_member_times_protocol_v2_is_synchronized_and_rejects_v1',
            'engine::parent_round_robin_preserves_every_index_and_parent_order',
            'engine::rar15_stored::tests::ordinary_volume_headers_share_one_metadata_budget',
            'engine::parent_round_robin_requires_owned_direct_memory_error_publication'
            'engine::release_helpers_use_only_the_bundled_runtime'
          )
          foreach ($testName in $tests) {
            $result = (cargo test --locked --manifest-path obz-rs/Cargo.toml --lib $testName -- --exact --nocapture 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Output $result
            if ($code) { exit $code }
            if ($result -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw "Expected exactly one passing pure test: $testName" }
          }
      - name: Deep extraction memory state and ordinary archive fixtures
        shell: pwsh
        run: |
          foreach ($module in @('deep_extract_plan::tests','deep_stream_copy::tests','deep_publication_state::tests','deep_volume_plan::tests')) {
            cargo test --locked --manifest-path obz-rs/Cargo.toml --lib $module
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          cargo test --locked --manifest-path obz-rs/Cargo.toml --test deep_extract -- --test-threads=1
          exit $LASTEXITCODE
      - name: Ordinary extraction conflict regressions
        shell: pwsh
        run: |
          $tests = @(
            'cli_auto_rename_reserves_actual_extraction_paths',
            'cli_file_colliding_with_directory_honors_safe_conflict_policies'
            'cli_smart_extraction_reports_the_retained_top_level_directory'
          )
          foreach ($testName in $tests) {
            $result = (cargo test --locked --manifest-path obz-rs/Cargo.toml --test operations_integration $testName -- --exact 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Output $result
            if ($code) { exit $code }
            if ($result -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw "Expected exactly one passing extraction test: $testName" }
          }
      - name: Classic stored RAR volume verification and extraction
        shell: pwsh
        run: |
          $testName = 'cli_classic_stored_rar_volumes_are_verified_before_publication'
          $result = (cargo test --locked --manifest-path obz-rs/Cargo.toml --test operations_integration $testName -- --exact 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $result
          if ($code) { exit $code }
          if ($result -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw "Expected exactly one passing RAR test: $testName" }
      - name: Cancel and retry an ordinary ZIP update
        shell: pwsh
        run: |
          $testName = 'engine::owned_update::tests::ordinary_zip_cancel_reaps_its_bound_engine_before_returning'
          $result = (cargo test --locked --manifest-path obz-rs/Cargo.toml --lib $testName -- --exact 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $result
          if ($code) { exit $code }
          if ($result -notmatch 'test result: ok\. 1 passed; 0 failed;') { throw "Expected exactly one passing ZIP update test: $testName" }
      - name: Explorer argument, COM and filesystem selection tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: ./scripts/msix/Build-Component.ps1 -Architecture x64
      - name: Public core tests (no external proprietary reference executable)
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --manifest-path obz-rs/Cargo.toml --target-dir obz-gui/target --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($name in 'obz.exe','obz-worker.exe') {
            $source = "obz-gui/target/debug/$name"
            $destination = "obz-gui/target/debug/deps/$name"
            # Cargo may hard-link these paths; copying identical files fails on Windows.
            if (!(Test-Path -LiteralPath $destination) -or (Get-FileHash -LiteralPath $source).Hash -ne (Get-FileHash -LiteralPath $destination).Hash) {
              Copy-Item -LiteralPath $source -Destination $destination -Force
            }
          }
          cargo test --locked --manifest-path obz-rs/Cargo.toml --target-dir obz-gui/target --lib --test archive_comment --test creation_safety --test engine_staging --test envelopes --test korean --test operations_integration --test native_hardening --test rare_formats --test motw_propagation --test extraction_threads --test engine_password_transport --test encrypted_split_selection --test zpaq_password_transport --test advanced_compression --test raw_streams --test verified_zip_create --test verified_7z_create
          exit $LASTEXITCODE
      - name: Require native local symbolic-link creation and existing-link editing
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          $tests = @(
            'engine::file_workspace::links::tests::require_symbolic_file_and_directory_success',
            'engine::file_workspace::links::edit::tests::require_symbolic_inspect_edit_clear_success'
          )
          foreach ($test in $tests) {
            $listed = (cargo test --locked --manifest-path obz-rs/Cargo.toml --target-dir obz-gui/target --lib $test -- --ignored --list | Out-String)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if (!$listed.Contains("${test}: test")) { throw "missing required symbolic-link acceptance: $test" }
            cargo test --locked --manifest-path obz-rs/Cargo.toml --target-dir obz-gui/target --lib $test -- --ignored --exact --nocapture
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          exit 0
      - name: Desktop regressions (explicit native test opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path obz-gui/Cargo.toml
          exit $LASTEXITCODE
      - name: Build hardened desktop and portable package
        shell: pwsh
        run: |
          $build = ./scripts/build-hardened.ps1
          python scripts/package.py --binary-directory $build.BinaryDirectory --output-directory dist/x64
          exit $LASTEXITCODE
      - name: Verify archive operations from the packaged x64 build
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem -LiteralPath dist/x64 -Filter '*-portable.zip' -File)
          if ($portable.Count -ne 1) { throw 'Expected exactly one x64 portable archive' }
          python scripts/check-public-package.py $portable[0].FullName
          exit $LASTEXITCODE
      - name: Verify packaged native ZIP cache and cancellation
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem -LiteralPath dist/x64 -Filter '*-portable.zip' -File)
          if ($portable.Count -ne 1) { throw 'Expected exactly one x64 portable archive' }
          ./scripts/check-selected-zip-cache.ps1 -Portable $portable[0].FullName -TargetDirectory target/hardened
      - name: Set up the hosted desktop tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywin32==312 pywinauto==0.6.9 websockets==15.0.1
          exit $LASTEXITCODE
      - name: Verify extraction and restore a script-owned ZIP from the Windows Recycle Bin
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -LiteralPath dist/x64 -Recurse -File -Filter qing-zip.exe)
          if ($exe.Count -ne 1) { throw 'Expected the packaged x64 GUI' }
          python scripts/check-hosted-recycle.py --exe $exe[0].FullName --out target/recycle-acceptance
          exit $LASTEXITCODE
      - name: Save Recycle Bin acceptance screenshots and receipt
        if: always() && hashFiles('target/recycle-acceptance/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x64-recycle-acceptance
          path: target/recycle-acceptance
          retention-days: 21
          if-no-files-found: error
      - name: Drop an ordinary archive from Explorer into the home window
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -LiteralPath dist/x64 -Recurse -File -Filter qing-zip.exe)
          if ($exe.Count -ne 1) { throw 'Expected the packaged x64 GUI' }
          python scripts/check-hosted-home-drop.py --exe $exe[0].FullName --out target/home-drop
          exit $LASTEXITCODE
      - name: Save native Explorer drop screenshots and file receipt
        if: always() && hashFiles('target/home-drop/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x64-home-explorer-drop
          path: target/home-drop
          retention-days: 21
          if-no-files-found: error
      - name: Check native ZIP creation and real file symbolic links
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: |
          python scripts/check-zip-create-worker.py --cli target/hardened/x86_64-pc-windows-msvc/release/obz.exe --console runtime/nanazip/NanaZip.Universal.Console.exe --require-file-symlink
          exit $LASTEXITCODE
      - name: Invoke the registered Explorer compression action for two files
        if: github.event_name == 'workflow_dispatch' && inputs.run_deep_tests
        shell: pwsh
        run: python scripts/check_classic_shell.py dist/x64 target/qing-shell/Release/qing-shell-classic-forwarding.exe
      - name: Upload validated Windows x64 portable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qing-zip-windows-x64-trial
          if-no-files-found: error
          retention-days: 21
          path: |
            dist/x64/*-portable.zip
            target/hardened/x86_64-pc-windows-msvc/release/hardened-build.json
            target/hardened/x86_64-pc-windows-msvc/release/pe-security.json

  nested-restart-capture:
    if: github.repository == 'qing-yi-5427/qing-zip' && github.event_name == 'workflow_dispatch' && inputs.nested_restart_capture
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NESTED_PRODUCT_RUN: ${{ inputs.nested_product_run }}
      NESTED_PRODUCT_SOURCE: ${{ inputs.nested_product_source }}
      NESTED_PACKAGE_SHA256: ${{ inputs.nested_package_sha256 }}
      NESTED_EXPECT_RECOVERY: ${{ inputs.nested_expect_recovery }}
      NESTED_LARGE_FIXTURE: ${{ inputs.nested_large_fixture }}
      NESTED_DOUBLE_EDIT: ${{ inputs.nested_double_edit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify R3 build and run isolated nested restart scenarios
        shell: pwsh
        run: |
          if ($env:NESTED_PRODUCT_RUN -notmatch '^\d{1,20}$' -or $env:NESTED_PRODUCT_SOURCE -notmatch '^[0-9a-f]{40}$' -or $env:NESTED_PACKAGE_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Explicit source and package pins required' }
          $run=gh api "repos/qing-yi-5427/qing-zip/actions/runs/$env:NESTED_PRODUCT_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.head_sha -cne $env:NESTED_PRODUCT_SOURCE -or $run.conclusion -cne 'success' -or $run.name -cne 'Windows regression') { throw 'Unexpected product build' }
          gh run download $env:NESTED_PRODUCT_RUN --repo qing-yi-5427/qing-zip --name qing-zip-windows-x64-trial --dir download
          if ($LASTEXITCODE) { throw 'R3 artifact unavailable' }
          $package=@(Get-ChildItem download -Recurse -File -Filter '*-portable.zip')
          if ($package.Count -ne 1) { throw 'Expected one portable package' }
          if ((Get-FileHash -LiteralPath $package[0].FullName).Hash.ToLowerInvariant() -cne $env:NESTED_PACKAGE_SHA256) { throw 'Portable package hash mismatch' }
          Expand-Archive -LiteralPath $package[0].FullName -DestinationPath staged
          $exe=@(Get-ChildItem staged -Recurse -File -Filter qing-zip.exe)
          if ($exe.Count -ne 1) { throw 'Expected one GUI executable' }
          New-Item -ItemType Directory -Force nested-restart-evidence | Out-Null
          @{ product_source=$run.head_sha; product_run=$run.id; package_sha256=(Get-FileHash $package[0].FullName).Hash.ToLowerInvariant(); gui_sha256=(Get-FileHash $exe[0].FullName).Hash.ToLowerInvariant(); harness=(git rev-parse HEAD).Trim() } | ConvertTo-Json | Set-Content -Encoding utf8 nested-restart-evidence/package.json
          python -m pip install --disable-pip-version-check playwright==1.55.0 pywinauto==0.6.9 Pillow==11.3.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $captureArgs=@('--exe', $exe[0].FullName)
          if ($env:NESTED_EXPECT_RECOVERY -eq 'true') { $captureArgs += '--expect-recovery' }
          if ($env:NESTED_LARGE_FIXTURE -eq 'true') { $captureArgs += '--large' }
          if ($env:NESTED_DOUBLE_EDIT -eq 'true') { $captureArgs += '--double-edit-only' }
          python scripts/nested_restart_gui.py @captureArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:NESTED_EXPECT_RECOVERY -eq 'true' -and $env:NESTED_DOUBLE_EDIT -ne 'true') {
            python scripts/nested_multi_layer_recovery.py --exe $exe[0].FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          exit 0
      - name: Preserve real GUI observations and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nested-restart-gui-evidence
          path: nested-restart-evidence/
          if-no-files-found: warn
          retention-days: 30
