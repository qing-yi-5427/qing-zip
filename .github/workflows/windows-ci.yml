name: Physical drag from qing-zip into Explorer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  drag:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch verified public 0.11.8 x64 trial
        shell: pwsh
        run: |
          $file=Join-Path $env:RUNNER_TEMP 'qing-zip-0.11.8-portable.zip'
          Invoke-WebRequest 'https://github.com/qing-yi-5427/qing-zip/releases/download/v0.11.8/qing-zip-0.11.8-portable.zip' -OutFile $file
          if ((Get-FileHash $file).Hash -ne 'CACA993662690D45CFBF679FFF1F5BEF50D6F3B21E686D80BFCE12F5D7FDABB4'){throw 'Unexpected portable'}
          Expand-Archive -LiteralPath $file -DestinationPath (Join-Path $env:RUNNER_TEMP 'qing-trial')
          python -m pip install pywinauto==0.6.9 pillow==11.3.0
      - name: Drag two selected items into a real destination folder
        run: python -u scripts/check-hosted-drag-out.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drag-out-desktop
          path: drag-evidence
