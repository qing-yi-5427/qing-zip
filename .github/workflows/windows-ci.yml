name: Isolated normal output ACL check
on: workflow_dispatch
permissions: {contents: read}
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch and verify published 0.11.8
        shell: pwsh
        run: |
          gh release download v0.11.8 --pattern qing-zip-0.11.8-portable.zip --dir incoming
          if ($LASTEXITCODE) {throw 'Release download failed'}
          $p=Get-Item incoming/qing-zip-0.11.8-portable.zip
          if ((Get-FileHash $p).Hash -ne 'caca993662690d45cfbf679fff1f5bef50d6f3b21e686d80bfce12f5d7fdabb4') {throw 'Wrong published package'}
          Expand-Archive $p.FullName app
      - name: Revoke destination inheritance while extracting to a regular private output
        shell: pwsh
        run: |
          $exe=@(Get-ChildItem app -Filter obz.exe -Recurse)[0]
          python scripts/check-live-output-acl.py $exe.FullName results
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: existing-acl-receipt, path: results/*.json}
