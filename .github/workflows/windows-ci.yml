name: Archive edits on verified disposable FAT images
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact candidate source, baseline is always tested
        required: false
        type: string
      source_run:
        description: Successful official x64 build for candidate, empty for baseline-only
        required: false
        type: string
permissions:
  actions: read
  contents: read
jobs:
  vhd:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        filesystem: [FAT32, exFAT]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Obtain exact released baseline and optional verified candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory fat-evidence | Out-Null
          $bins=@{}
          function Portable($role,$archive,$cliHash,$guiHash,$source) {
            $dir=Join-Path $env:RUNNER_TEMP ("fat-package-"+$role)
            Expand-Archive -LiteralPath $archive -DestinationPath $dir
            $cli=@(Get-ChildItem $dir -Recurse -File -Filter 'obz.exe')
            $gui=@(Get-ChildItem $dir -Recurse -File -Filter 'qing-zip.exe')
            if($cli.Count -ne 1 -or $gui.Count -ne 1 -or (Get-FileHash $cli[0].FullName).Hash.ToLowerInvariant() -cne $cliHash -or (Get-FileHash $gui[0].FullName).Hash.ToLowerInvariant() -cne $guiHash){throw 'Wrong executable identity'}
            $bins[$role]=@{cli=$cli[0].FullName;gui=$gui[0].FullName;cli_sha=$cliHash;gui_sha=$guiHash;source=$source;archive_sha=(Get-FileHash $archive).Hash.ToLowerInvariant()}
          }
          $old=Join-Path $env:RUNNER_TEMP 'old.zip'
          try {
            Invoke-WebRequest 'https://github.com/qing-yi-5427/qing-zip/releases/download/v0.11.8/qing-zip-0.11.8-portable.zip' -MaximumRetryCount 2 -RetryIntervalSec 2 -OutFile $old
          } catch {
            Invoke-WebRequest ("https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/723336739?qa="+[Guid]::NewGuid().ToString("N")) -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/octet-stream'} -MaximumRetryCount 3 -RetryIntervalSec 2 -OutFile $old
          }
          if((Get-FileHash $old).Hash.ToLowerInvariant() -cne 'caca993662690d45cfbf679fff1f5bef50d6f3b21e686d80bfce12f5d7fdabb4'){throw 'Wrong baseline package'}
          Portable 'release' $old 'c17930677e2938f58bfd1bca7dd97313d774db51f6c7c2e926a6716835d9ead0' '319112564bbeb8fbb18f6a9a2f45576dd05d7e215ec4b458250b373f48884ac7' '55f874e52e04067752dc697eb46e0aa8af1a42da'
          if($env:SOURCE_RUN -or $env:SOURCE_SHA) {
            if($env:SOURCE_RUN -cnotmatch '^[0-9]+$' -or $env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$'){throw 'Invalid source binding'}
            $official=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
            if($official.head_sha -cne $env:SOURCE_SHA -or $official.conclusion -ne 'success' -or $official.path -ne '.github/workflows/windows-ci.yml'){throw 'Unverified build'}
            $art=@((gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN/artifacts" | ConvertFrom-Json).artifacts | Where-Object {$_.name -eq 'qing-zip-windows-x64-trial' -and !$_.expired})
            if($art.Count -ne 1 -or $art[0].workflow_run.head_sha -cne $env:SOURCE_SHA){throw 'Unexpected official artifact'}
            $z=Join-Path $env:RUNNER_TEMP 'donor.zip'
            Invoke-WebRequest $art[0].archive_download_url -MaximumRetryCount 3 -RetryIntervalSec 2 -Headers @{Authorization="Bearer $env:GH_TOKEN"} -OutFile $z
            if(('sha256:'+(Get-FileHash $z).Hash.ToLowerInvariant()) -cne $art[0].digest){throw 'Artifact digest mismatch'}
            $dir=Join-Path $env:RUNNER_TEMP 'donor';Expand-Archive -LiteralPath $z -DestinationPath $dir
            $build=@(Get-ChildItem $dir -Recurse -Filter 'hardened-build.json')
            $portable=@(Get-ChildItem $dir -Recurse -File -Filter '*-portable.zip')
            if($build.Count -ne 1 -or $portable.Count -ne 1){throw 'Unexpected artifact layout'}
            $rec=Get-Content -Raw $build[0].FullName | ConvertFrom-Json
            if($rec.target -cne 'x86_64-pc-windows-msvc'){throw 'Wrong target'}
            Portable 'candidate' $portable[0].FullName ($rec.binaries|Where-Object name -eq 'obz.exe').sha256 ($rec.binaries|Where-Object name -eq 'obz-gui.exe').sha256 $env:SOURCE_SHA
          }
          $bins | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM fat-evidence/tools.json
          python -m pip install pywinauto==0.6.9
      - name: Create uniquely backed image, revalidate device and exercise real archive operations
        shell: pwsh
        run: ./scripts/check-hosted-vhd.ps1 -FileSystem '${{ matrix.filesystem }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fat-compatibility-${{ matrix.filesystem }}
          path: fat-evidence