name: Copy archive selections into real Explorer after desktop exit
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Validated x64 build run ID
        required: true
        type: string
      source_sha:
        description: Exact x64 build source commit
        required: true
        type: string
      architecture:
        description: Architecture of the actual portable package
        type: choice
        options: [x64, arm64]
        default: x64
      asset:
        description: Optional release asset ID, downloaded with a temporary read-only URL
        type: string
      package_sha:
        description: SHA256 of the verified release portable ZIP
        type: string
      gui_sha:
        description: SHA256 of the verified release GUI
        type: string
permissions:
  contents: read
  actions: read
jobs:
  drag:
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the exact release portable with no write credential
        if: inputs.asset != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ASSET_ID: ${{ inputs.asset }}
          PORTABLE_SHA: ${{ inputs.package_sha }}
          GUI_SHA: ${{ inputs.gui_sha }}
          PLATFORM: ${{ inputs.architecture }}
          QA_URL: ${{ inputs.architecture == 'arm64' && secrets.QING_QA_0119_ARM64_PORTABLE_URL || secrets.QING_QA_0119_X64_PORTABLE_URL }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:SOURCE_RUN -cnotmatch '^[0-9]+$' -or $env:ASSET_ID -cnotmatch '^[0-9]+$' -or $env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:GUI_SHA -cnotmatch '^[a-f0-9]{64}$' -or $env:PORTABLE_SHA -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid release verification inputs' }
          $src=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          $workflow=if($env:PLATFORM -eq 'arm64'){'.github/workflows/windows-arm64.yml'} else {'.github/workflows/windows-ci.yml'}
          if($src.head_sha -cne $env:SOURCE_SHA -or $src.conclusion -ne 'success' -or $src.path -cne $workflow) { throw 'Wrong source validation' }
          try { $url=[uri]$env:QA_URL } catch { throw 'Invalid temporary package location' }
          if($url.Scheme -cne 'https' -or $url.Host -notin 'release-assets.githubusercontent.com','objects.githubusercontent.com') { throw 'Unrecognized release asset origin' }
          $out=Join-Path $env:RUNNER_TEMP 'exact-portable.zip'
          try { Invoke-WebRequest -Uri $url -OutFile $out } catch { throw 'Temporary asset download failed' }
          if ((Get-FileHash $out).Hash.ToLowerInvariant() -cne $env:PORTABLE_SHA){ throw 'Wrong release portable digest' }
          $root=Join-Path $env:RUNNER_TEMP 'qing-trial'
          Expand-Archive -LiteralPath $out -DestinationPath $root
          $gui=@(Get-ChildItem $root -Recurse -File -Filter 'qing-zip.exe')
          if($gui.Count -ne 1 -or (Get-FileHash $gui[0].FullName).Hash.ToLowerInvariant() -cne $env:GUI_SHA) { throw 'Wrong actual GUI digest' }
          foreach ($suite in 'CLIP','DRAG') {
            "QING_${suite}_GUI_SHA=$env:GUI_SHA" >> $env:GITHUB_ENV
            "QING_${suite}_SOURCE_RUN=$env:SOURCE_RUN" >> $env:GITHUB_ENV
            "QING_${suite}_SOURCE_SHA=$env:SOURCE_SHA" >> $env:GITHUB_ENV
            "QING_${suite}_ARTIFACT_DIGEST=sha256:$env:PORTABLE_SHA" >> $env:GITHUB_ENV
          }
          "QING_QA_ASSET_ID=$env:ASSET_ID" >> $env:GITHUB_ENV
          "QING_QA_ARCH=$env:PLATFORM" >> $env:GITHUB_ENV
      - name: Fetch the exact verified Windows x64 build
        if: inputs.asset == '' && inputs.architecture == 'x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN: ${{ inputs.source_run }}
          UPSTREAM_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $sourceId=$env:UPSTREAM_RUN
          $sourceSha=$env:UPSTREAM_SHA
          if ($sourceId -cnotmatch '^[0-9]+$' -or $sourceSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source request' }
          $run=gh api "repos/$repo/actions/runs/$sourceId" | ConvertFrom-Json
          if ($run.head_sha -cne $sourceSha -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/windows-ci.yml') { throw 'Unexpected source workflow' }
          $items=@((gh api "repos/$repo/actions/runs/$sourceId/artifacts" | ConvertFrom-Json).artifacts | Where-Object { $_.name -eq 'qing-zip-windows-x64-trial' -and !$_.expired })
          if ($items.Count -ne 1 -or $items[0].workflow_run.head_sha -cne $sourceSha) { throw 'Unexpected source artifacts' }
          $artifact=$items[0]
          $pack=Join-Path $env:RUNNER_TEMP 'source-artifact.zip'
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json' }
          Invoke-WebRequest -Uri $artifact.archive_download_url -Headers $headers -OutFile $pack
          if (('sha256:'+(Get-FileHash $pack).Hash.ToLowerInvariant()) -cne $artifact.digest) { throw 'Artifact digest mismatch' }
          $dir=Join-Path $env:RUNNER_TEMP 'source-artifact'
          Expand-Archive -LiteralPath $pack -DestinationPath $dir
          $portables=@(Get-ChildItem $dir -Recurse -File -Filter '*-portable.zip')
          $builds=@(Get-ChildItem $dir -Recurse -File -Filter 'hardened-build.json')
          if ($portables.Count -ne 1 -or $builds.Count -ne 1) { throw 'Unexpected nested artifact layout' }
          $build=Get-Content -Raw $builds[0].FullName | ConvertFrom-Json
          if ($build.target -cne 'x86_64-pc-windows-msvc') { throw 'Unexpected architecture' }
          $gui=@($build.binaries | Where-Object name -eq 'obz-gui.exe')
          if ($gui.Count -ne 1 -or $gui[0].sha256 -cnotmatch '^[a-f0-9]{64}$') { throw 'No GUI digest in build receipt' }
          Expand-Archive -LiteralPath $portables[0].FullName -DestinationPath (Join-Path $env:RUNNER_TEMP 'qing-trial')
          "QING_CLIP_GUI_SHA=$($gui[0].sha256)" >> $env:GITHUB_ENV
          "QING_CLIP_SOURCE_RUN=$sourceId" >> $env:GITHUB_ENV
          "QING_CLIP_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV
          "QING_CLIP_ARTIFACT_DIGEST=$($artifact.digest)" >> $env:GITHUB_ENV
      - name: Install GUI automation helpers
        run: python -m pip install pywinauto==0.6.9 pillow==11.3.0
      - name: Copy, cancel, reject corrupt data and paste after exit into Explorer
        run: python -u scripts/check-hosted-clipboard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clipboard-desktop
          path: clipboard-evidence

      - name: Drag, cancel and retry from the exact release into Explorer
        if: inputs.asset != '' && inputs.architecture == 'x64'
        run: python -u scripts/check-hosted-drag-out.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.asset != '' && inputs.architecture == 'x64'
        with:
          name: drag-out-desktop
          path: drag-evidence
