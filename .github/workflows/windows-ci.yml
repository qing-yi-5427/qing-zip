name: Minimized workbench experiment
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Candidate build run, or baseline for harness verification
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  memory:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_run }}
        run: |
          $baseline='42456912193'
          foreach($build in @('baseline','candidate')){
            $id=if($build -eq 'candidate' -and $env:CANDIDATE -ne 'baseline'){$env:CANDIDATE}else{$baseline}
            if($id -notmatch '^[0-9]+$'){throw "Invalid run ID"}
            $result=gh run view $id --json headSha,conclusion|ConvertFrom-Json
            $expected=if($id -eq $baseline){'336be6e'}else{'8695991'}
            if(!$result.headSha.StartsWith($expected) -or $result.conclusion -ne 'success'){throw "Unexpected build"}
            gh run download $id -n qing-zip-windows-x64-trial -D "incoming-$build"
            if($LASTEXITCODE){exit $LASTEXITCODE}
            $z=@(Get-ChildItem "incoming-$build" -Filter '*-portable.zip' -Recurse)
            if($z.Count -ne 1){throw "Missing package"}
            Expand-Archive $z[0].FullName $build
          }
          python -m pip install psutil==6.1.1 pywinauto==0.6.9
          if($LASTEXITCODE){exit $LASTEXITCODE}
          python -X utf8 scripts/compare-minimized-desktops.py baseline/qing-zip.exe candidate/qing-zip.exe results
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-observations
          path: results/
