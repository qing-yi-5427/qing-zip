name: Existing-directory publication candidate comparison
on: workflow_dispatch
permissions: {contents: read}
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0ea90c462b52b2ae93021abcbc9e9203fc0eb862
          path: candidate-source
      - name: Build hardened candidate CLI and run publication tests
        shell: pwsh
        run: |
          Push-Location candidate-source
          if (-not (git rev-parse HEAD).StartsWith('0ea90c462b52b2ae93021abcbc9e9203fc0eb862')) { throw 'Unexpected candidate revision' }
          $target='x86_64-pc-windows-msvc'
          $cfg=Join-Path $env:RUNNER_TEMP 'file-copy-hardening.toml'
          @'
          [target.x86_64-pc-windows-msvc]
          rustflags=["-C","target-feature=+crt-static","-C","control-flow-guard=yes","-C","link-arg=/CETCOMPAT","-C","link-arg=/DYNAMICBASE","-C","link-arg=/HIGHENTROPYVA","-C","link-arg=/NXCOMPAT"]
          '@ | Set-Content $cfg
          cargo --config $cfg build --target $target --release --locked --manifest-path obz-rs/Cargo.toml --bin obz
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          cargo test --locked --manifest-path obz-rs/Cargo.toml --lib --test engine_staging --test motw_propagation --test encrypted_split_selection
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          Pop-Location
      - name: Fetch and verify published 0.11.8
        shell: pwsh
        run: |
          gh release download v0.11.8 --pattern qing-zip-0.11.8-portable.zip --dir incoming
          if ($LASTEXITCODE) {throw 'Release download failed'}
          $p=Get-Item incoming/qing-zip-0.11.8-portable.zip
          if ((Get-FileHash $p).Hash -ne 'caca993662690d45cfbf679fff1f5bef50d6f3b21e686d80bfce12f5d7fdabb4') {throw 'Wrong published package'}
          Expand-Archive $p.FullName app
      - name: Extract to five existing-directory layouts and verify every file
        shell: pwsh
        run: |
          $exe=@(Get-ChildItem app -Filter obz.exe -Recurse)[0]
          python scripts/compare-existing-extract.py $exe.FullName results candidate-source/obz-rs/target/x86_64-pc-windows-msvc/release/obz.exe
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: trial-extraction-evidence, path: results/*.json}
