name: Copy archive selections into real Explorer after desktop exit
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Validated x64 build run ID
        required: true
        type: string
      source_sha:
        description: Exact x64 build source commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  drag:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the exact verified Windows x64 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN: ${{ inputs.source_run }}
          UPSTREAM_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $sourceId=$env:UPSTREAM_RUN
          $sourceSha=$env:UPSTREAM_SHA
          if ($sourceId -cnotmatch '^[0-9]+$' -or $sourceSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source request' }
          $run=gh api "repos/$repo/actions/runs/$sourceId" | ConvertFrom-Json
          if ($run.head_sha -cne $sourceSha -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/windows-ci.yml') { throw 'Unexpected source workflow' }
          $items=@((gh api "repos/$repo/actions/runs/$sourceId/artifacts" | ConvertFrom-Json).artifacts | Where-Object { $_.name -eq 'qing-zip-windows-x64-trial' -and !$_.expired })
          if ($items.Count -ne 1 -or $items[0].workflow_run.head_sha -cne $sourceSha) { throw 'Unexpected source artifacts' }
          $artifact=$items[0]
          $pack=Join-Path $env:RUNNER_TEMP 'source-artifact.zip'
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json' }
          Invoke-WebRequest -Uri $artifact.archive_download_url -Headers $headers -OutFile $pack
          if (('sha256:'+(Get-FileHash $pack).Hash.ToLowerInvariant()) -cne $artifact.digest) { throw 'Artifact digest mismatch' }
          $dir=Join-Path $env:RUNNER_TEMP 'source-artifact'
          Expand-Archive -LiteralPath $pack -DestinationPath $dir
          $portables=@(Get-ChildItem $dir -Recurse -File -Filter '*-portable.zip')
          $builds=@(Get-ChildItem $dir -Recurse -File -Filter 'hardened-build.json')
          if ($portables.Count -ne 1 -or $builds.Count -ne 1) { throw 'Unexpected nested artifact layout' }
          $build=Get-Content -Raw $builds[0].FullName | ConvertFrom-Json
          if ($build.target -cne 'x86_64-pc-windows-msvc') { throw 'Unexpected architecture' }
          $gui=@($build.binaries | Where-Object name -eq 'obz-gui.exe')
          if ($gui.Count -ne 1 -or $gui[0].sha256 -cnotmatch '^[a-f0-9]{64}$') { throw 'No GUI digest in build receipt' }
          Expand-Archive -LiteralPath $portables[0].FullName -DestinationPath (Join-Path $env:RUNNER_TEMP 'qing-trial')
          "QING_CLIP_GUI_SHA=$($gui[0].sha256)" >> $env:GITHUB_ENV
          "QING_CLIP_SOURCE_RUN=$sourceId" >> $env:GITHUB_ENV
          "QING_CLIP_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV
          "QING_CLIP_ARTIFACT_DIGEST=$($artifact.digest)" >> $env:GITHUB_ENV
          python -m pip install pywinauto==0.6.9 pillow==11.3.0 websockets==15.0.1
      - name: Copy, cancel, reject corrupt data and paste after exit into Explorer
        run: python -u scripts/check-hosted-clipboard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clipboard-desktop
          path: clipboard-evidence
