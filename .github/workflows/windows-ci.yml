name: Shell dialog verification
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64, donor: '42456912193', artifact: qing-zip-windows-x64-trial }
          - { runner: windows-11-arm, arch: ARM64, donor: '42456912207', artifact: qing-zip-0.11.7-windows-arm64-trial }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = (gh run view ${{ matrix.donor }} --json headSha,conclusion |ConvertFrom-Json)
          if($commit.headSha -ne "336be6e2499621934c94f3539c640917ce66b89d" -or $commit.conclusion -ne "success") { throw "Unexpected package provenance" }
          $env:PACKAGE_SOURCE_COMMIT=$commit.headSha
          git diff --quiet $commit.headSha HEAD -- obz-gui obz-rs runtime
          if($LASTEXITCODE) { throw "Packaged product changed" }
          if('${{ matrix.arch }}' -eq 'x64'){
            $packageHash='c420e655f8436751f62e39a38e8e57979f00e080714baef5e16ec8dfab406cc7'
            $guiHash='a04fda1b8665339e93b4863614d64393c8cff21c6529987bc45cf7c0ffbfcb76'
            gh release download v0.11.7 --pattern qing-zip-0.11.7-portable.zip --dir dist
          }else{
            $packageHash='d525bc824db465f32684fc20ec3e36a47eedf65d98b70de8de45f55ac9d3efe8'
            $guiHash='11a948ed3ba4bc3a4dbadd8b9de44244b15a32fe08b826f63bcb14fc97029d33'
            gh run download ${{ matrix.donor }} --name ${{ matrix.artifact }} --dir dist
          }
          if($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = @(Get-ChildItem dist -Recurse -Filter '*-portable.zip')
          if($archive.Count -ne 1 -or (Get-FileHash $archive[0].FullName).Hash -ne $packageHash) { throw "Unexpected release portable archive" }
          $env:RELEASE_ARCHIVE_SHA256=$packageHash
          $portable=Join-Path dist $archive[0].BaseName
          Expand-Archive $archive[0].FullName $portable
          if((Get-FileHash (Join-Path $portable qing-zip.exe)).Hash -ne $guiHash){throw "Unexpected release executable"}
          cmake -S qing-shell -B target/shell -A ${{ matrix.arch }}
          if($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build target/shell --config Release --target qing-shell-classic-forwarding
          if($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 scripts/check_classic_shell.py dist target/shell/Release/qing-shell-classic-forwarding.exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: explorer-dialog-${{ matrix.arch }}
          path: dist/shell-create-dialog.*
