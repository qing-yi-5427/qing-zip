name: Existing-directory publication candidate comparison
on: workflow_dispatch
permissions: {contents: read}
jobs:
  compare:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        count: [12000,50000]
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 847d399e2170148edc458b8c5c267c59fec8f332
          path: candidate-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ab6ad7db742a2d1732874d1a2120e85ac0bf991
          path: bounded
      - name: Build both hardened CLIs and verify native journal eligibility
        shell: pwsh
        run: |
          Push-Location candidate-source
          if (-not (git rev-parse HEAD).StartsWith('847d399e2170148edc458b8c5c267c59fec8f332')) { throw 'Unexpected candidate revision' }
          $target='x86_64-pc-windows-msvc'
          $cfg=Join-Path $env:RUNNER_TEMP 'file-copy-hardening.toml'
          @'
          [target.x86_64-pc-windows-msvc]
          rustflags=["-C","target-feature=+crt-static","-C","control-flow-guard=yes","-C","link-arg=/CETCOMPAT","-C","link-arg=/DYNAMICBASE","-C","link-arg=/HIGHENTROPYVA","-C","link-arg=/NXCOMPAT"]
          '@ | Set-Content $cfg
          cargo --config $cfg build --target $target --release --locked --manifest-path obz-rs/Cargo.toml --bin obz
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          Pop-Location
          Push-Location bounded
          if ((git rev-parse HEAD) -ne '4ab6ad7db742a2d1732874d1a2120e85ac0bf991') {throw 'Wrong trial SHA'}
          $volume=$env:TEMP.Substring(0,2)
          fsutil usn queryjournal $volume
          if ($LASTEXITCODE) {fsutil usn createjournal m=268435456 a=33554432 $volume}
          if ($LASTEXITCODE) {throw 'Disposable test volume has no usable NTFS journal'}
          cargo --config $cfg build --target $target --target-dir $env:RUNNER_TEMP/bounded-build --release --locked --manifest-path obz-rs/Cargo.toml --bin obz
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          cargo test --locked --manifest-path obz-rs/Cargo.toml --lib compact_receipt
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          Pop-Location
      - name: Fetch and verify published 0.11.8
        shell: pwsh
        run: |
          gh release download v0.11.8 --pattern qing-zip-0.11.8-portable.zip --dir incoming
          if ($LASTEXITCODE) {throw 'Release download failed'}
          $p=Get-Item incoming/qing-zip-0.11.8-portable.zip
          if ((Get-FileHash $p).Hash -ne 'caca993662690d45cfbf679fff1f5bef50d6f3b21e686d80bfce12f5d7fdabb4') {throw 'Wrong published package'}
          Expand-Archive $p.FullName app
      - name: Compare handle, private memory and time for a fresh 12000-file output
        shell: pwsh
        run: |
          python -m pip install --quiet --only-binary=:all: psutil==7.1.3
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $exe=@(Get-ChildItem app -Filter obz.exe -Recurse)[0]
          python scripts/compare-new-extract-resources.py $exe.FullName candidate-source/obz-rs/target/x86_64-pc-windows-msvc/release/obz.exe $env:RUNNER_TEMP/bounded-build/x86_64-pc-windows-msvc/release/obz.exe resource-results/handles.json ${{ matrix.count }}
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-extraction-resources-${{ matrix.count }}
          path: resource-results/*.json
