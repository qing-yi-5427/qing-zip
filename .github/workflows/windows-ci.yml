name: Shell dialog verification
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64, donor: '42456912193', artifact: qing-zip-windows-x64-trial }
          - { runner: windows-11-arm, arch: ARM64, donor: '42456912207', artifact: qing-zip-0.11.7-windows-arm64-trial }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = (gh run view ${{ matrix.donor }} --json headSha,conclusion |ConvertFrom-Json)
          if($commit.headSha -ne "336be6e2499621934c94f3539c640917ce66b89d" -or $commit.conclusion -ne "success") { throw "Unexpected package provenance" }
          $env:PACKAGE_SOURCE_COMMIT=$commit.headSha
          git diff --quiet $commit.headSha HEAD -- obz-gui obz-rs runtime
          if($LASTEXITCODE) { throw "Packaged product changed" }
          gh run download ${{ matrix.donor }} --name ${{ matrix.artifact }} --dir dist
          if($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = @(Get-ChildItem dist -Recurse -Filter '*-portable.zip')
          if($archive.Count -ne 1) { throw "Missing portable package" }
          Expand-Archive $archive[0].FullName (Join-Path dist $archive[0].BaseName)
          cmake -S qing-shell -B target/shell -A ${{ matrix.arch }}
          if($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build target/shell --config Release --target qing-shell-classic-forwarding
          if($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 scripts/check_classic_shell.py dist target/shell/Release/qing-shell-classic-forwarding.exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: explorer-dialog-${{ matrix.arch }}
          path: dist/shell-create-dialog.*
