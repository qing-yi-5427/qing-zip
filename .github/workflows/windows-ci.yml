name: Compare verified publication on existing destinations
on: workflow_dispatch
permissions: {contents: read}
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: base-source
          ref: 3b203eef287c200d8c8ef1b7fe0b17c8f790d6e0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate-source
          ref: bc184c5eb581eed0eaa790a40adb98b8bf6cbd2d
      - name: Build both versions with the same compiler and safety flags
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR=Join-Path $env:RUNNER_TEMP 'cargo-output'
          $target='x86_64-pc-windows-msvc'
          $cfg=Join-Path $env:RUNNER_TEMP 'hardening.toml'
          @'
          [target.x86_64-pc-windows-msvc]
          rustflags=["-C","target-feature=+crt-static","-C","control-flow-guard=yes","-C","link-arg=/CETCOMPAT","-C","link-arg=/DYNAMICBASE","-C","link-arg=/HIGHENTROPYVA","-C","link-arg=/NXCOMPAT"]
          '@ | Set-Content -Encoding utf8 $cfg
          foreach($tree in @('base-source','candidate-source')){
            Push-Location $tree
            cargo --config $cfg build --release --locked --target $target --manifest-path obz-rs/Cargo.toml --bin obz
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Copy-Item (Join-Path $env:CARGO_TARGET_DIR "$target/release/obz.exe") ./obz.exe
            Pop-Location
          }
          Push-Location candidate-source
          cargo --config $cfg test --locked --target $target --manifest-path obz-rs/Cargo.toml --lib staging_tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo --config $cfg test --locked --target $target --manifest-path obz-rs/Cargo.toml --test engine_staging
          exit $LASTEXITCODE
      - name: Verify contents and compare end-to-end timings
        run: python -u scripts/compare-existing-extract.py base-source/obz.exe results candidate-source/obz.exe
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: existing-output-results, path: results/*.json}
