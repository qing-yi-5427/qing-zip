name: Hosted x64 typed directory comparison
on: workflow_dispatch
permissions: {contents: read, actions: read}
jobs:
  profile:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch exact validated release candidates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory results
          foreach ($v in @(@('bounded',42456853882,'21d92f208fa00b03ae19b54b8be4ba1046d4b92f'),@('typed',42457151341,'3701157'))) {
            $run=$v[1]; $label=$v[0]
            gh run watch $run --exit-status --interval 30
            if ($LASTEXITCODE) {throw 'Build did not pass'}
            $r=gh run view $run --json headSha,url | ConvertFrom-Json
            if (-not $r.headSha.StartsWith($v[2])) {throw 'Wrong source'}
            $r | ConvertTo-Json | Set-Content "results/$label-source.json"
            gh run download $run --name qing-zip-windows-x64-trial --dir "download-$label"
            if ($LASTEXITCODE) {throw 'Missing hardened portable application'}
            $zip=@(Get-ChildItem "download-$label" -Recurse -Filter '*-portable.zip')
            if ($zip.Count -ne 1) {throw 'Invalid artifact'}
            Expand-Archive $zip[0].FullName $label
          }
          $a=@(Get-ChildItem bounded -Recurse -Filter obz.exe)[0]
          $b=@(Get-ChildItem typed -Recurse -Filter obz.exe)[0]
          python scripts/compare-hosted-list.py $a.FullName $b.FullName results
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-typed-list-evidence
          path: results/*.json
