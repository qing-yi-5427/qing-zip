name: Observe Explorer completion signals
on: workflow_dispatch
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - shell: pwsh
        run: |
          python -m pip install pywinauto==0.6.9
          cmake -S scripts/drag-signal-fixture -B target/probe -A x64
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cmake --build target/probe --config Release
          if($LASTEXITCODE){exit $LASTEXITCODE}
          python -X utf8 scripts/drag-signal-fixture/probe.py
          exit $LASTEXITCODE
