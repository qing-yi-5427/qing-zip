name: Receipt security layout diagnostic
on:
  push:
    branches: [codex/receipt-security-hosted-diagnostic]
  workflow_dispatch:
jobs:
  read-security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare fresh mask7 descriptors on synthetic objects
        run: python scripts/diagnose-receipt-security.py
      - name: Real Rust receipt security regressions
        run: python scripts/check-receipt-security-hosted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-security-${{ matrix.os }}
          path: |
            receipt-security-diagnostic.json
            receipt-rust-evidence/*
          if-no-files-found: error
