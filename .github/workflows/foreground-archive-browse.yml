name: Foreground archive browsing
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'Baseline main Windows regression run'
        required: true
        type: string
        default: '45170725035'
      baseline_sha256:
        description: 'Baseline portable ZIP SHA-256'
        required: true
        type: string
        default: '055659fc7aac67c53a6f4984df9383fdac688c0d370c8d501c58847660352701'
      candidate_run:
        description: 'Candidate main Windows regression run'
        required: true
        type: string
        default: '45191942063'
      candidate_sha256:
        description: 'Candidate portable ZIP SHA-256'
        required: true
        type: string
        default: '0c00da2912bc7cc5b142dab31161b296ca03bd926e878dc781ba45d0fa0a9d66'
jobs:
  foreground-browse:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare two pinned packages on the active Windows desktop
        shell: pwsh
        env:
          BASELINE_RUN: ${{ inputs.baseline_run }}
          BASELINE_SHA: ${{ inputs.baseline_sha256 }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pywin32==312 websockets==15.0.1 playwright==1.55.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(
            @{ label='baseline'; run=$env:BASELINE_RUN; sha=$env:BASELINE_SHA }
            @{ label='candidate'; run=$env:CANDIDATE_RUN; sha=$env:CANDIDATE_SHA }
          )
          $exe = @{}
          foreach ($package in $packages) {
            if ($package.run -notmatch '^[0-9]+$' -or $package.sha -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid package coordinates' }
            $build = gh api "repos/qing-yi-5427/qing-zip/actions/runs/$($package.run)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $build.conclusion -ne 'success' -or $build.path -ne '.github/workflows/windows-ci.yml' -or $build.event -ne 'push' -or $build.head_branch -ne 'main') { throw 'Expected a successful main Windows regression build' }
            $package.source = $build.head_sha
            $download = 'download-' + $package.label
            gh run download $package.run --repo qing-yi-5427/qing-zip --name qing-zip-windows-x64-trial --dir $download
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $zip = @(Get-ChildItem -LiteralPath $download -Filter '*portable.zip' -Recurse)
            if ($zip.Count -ne 1 -or (Get-FileHash -LiteralPath $zip[0].FullName).Hash -ne $package.sha) { throw 'Unexpected portable package' }
            Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $package.label
            $gui = @(Get-ChildItem -LiteralPath $package.label -Filter qing-zip.exe -Recurse)
            if ($gui.Count -ne 1) { throw 'Expected one GUI' }
            $exe[$package.label] = $gui[0].FullName
          }
          New-Item -ItemType Directory evidence
          [ordered]@{ cpu=(Get-CimInstance Win32_Processor).Name; os=(Get-CimInstance Win32_OperatingSystem).Caption; build=[Environment]::OSVersion.Version.ToString(); memory_bytes=(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory; packages=$packages } | ConvertTo-Json -Depth 4 | Set-Content evidence/environment.json
          python scripts/measure-webview-archive.py --hosted --baseline $exe.baseline --candidate $exe.candidate --rounds 5 --screenshots evidence/screens --receipt evidence/browse.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foreground-archive-browse
          path: evidence
