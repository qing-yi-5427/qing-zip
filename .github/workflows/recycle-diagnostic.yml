name: Recycle Bin fixture diagnostics
on:
  pull_request:
    paths:
      - 'scripts/check-hosted-recycle.py'
      - '.github/workflows/recycle-diagnostic.yml'
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        fixture: [runner, system]
    env:
      GH_TOKEN: ${{ github.token }}
      FIXTURE_LOCATION: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover the fixed baseline build from its hosted artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Disposable hosted x64 required' }
          $repo='qing-yi-5427/qing-zip'
          $run='45109164716'
          $source='c6810ef6f9d668c7ed642b3a586ed57d2ad28940'
          if ((gh run view $run --repo $repo --json headSha --jq .headSha) -ne $source) { throw 'Unexpected baseline commit' }
          gh run download $run --repo $repo --name qing-zip-windows-x64-trial --dir target/reference
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip=@(Get-ChildItem target/reference -Recurse -Filter '*-portable.zip' -File)
          $receipts=@(Get-ChildItem target/reference -Recurse -Filter 'hardened-build.json' -File)
          if ($zip.Count -ne 1 -or $receipts.Count -ne 1) { throw 'Expected one portable ZIP and one hardened build receipt' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath target/staged
          $exe=@(Get-ChildItem target/staged -Recurse -Filter qing-zip.exe -File)
          if ($exe.Count -ne 1) { throw 'Expected one staged executable' }
          $build=Get-Content -Raw $receipts[0].FullName | ConvertFrom-Json
          $expected=($build.binaries | Where-Object name -eq 'obz-gui.exe').sha256
          if (!$expected -or (Get-FileHash $exe[0].FullName).Hash -ine $expected) { throw 'Baseline executable digest mismatch' }
          "QING_RECYCLE_BASELINE_EXE=$($exe[0].FullName)" >> $env:GITHUB_ENV
          python -m pip install --disable-pip-version-check pywin32==312 websockets==15.0.1
          exit $LASTEXITCODE
      - name: Compare app recycling with a normal Windows Shell operation
        shell: pwsh
        run: |
          python scripts/check-hosted-recycle.py --exe $env:QING_RECYCLE_BASELINE_EXE --out target/recycle-diagnostic --fixture-location $env:FIXTURE_LOCATION --shell-control
          exit $LASTEXITCODE
      - name: Save fixture-specific evidence
        if: always() && hashFiles('target/recycle-diagnostic/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recycle-diagnostic-${{ matrix.fixture }}
          path: target/recycle-diagnostic
          retention-days: 21
          if-no-files-found: error
