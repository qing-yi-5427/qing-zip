name: Bounded ordinary archive soak
on:
  pull_request:
    paths:
      - 'scripts/soak-ordinary-archives.py'
      - 'scripts/test-soak-ordinary-archives.py'
      - '.github/workflows/archive-soak.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-archive-soak:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record runner and source before build
        shell: pwsh
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path evidence | Out-Null
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Hosted Windows x64 runner required' }
          $data = @{source=(git rev-parse HEAD).Trim(); pr_head=$env:PR_HEAD; runner=$env:RUNNER_OS; arch=$env:RUNNER_ARCH; run=$env:GITHUB_RUN_ID; stage='build-pending'}
          $data | ConvertTo-Json | Set-Content evidence/bootstrap.json -Encoding utf8
      - name: Build and package hardened product from this checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python scripts/verify-runtime.py
          if ($LASTEXITCODE) { throw 'Runtime provenance failed' }
          $build = ./scripts/build-hardened.ps1
          python scripts/package.py --binary-directory $build.BinaryDirectory --output-directory dist/soak
          if ($LASTEXITCODE) { throw 'Portable package failed' }
          $cli = @(Get-ChildItem dist/soak -Recurse -File -Filter obz.exe)
          if ($cli.Count -ne 1) { throw 'Expected exactly one staged portable CLI' }
          $package = @(Get-ChildItem dist/soak -File -Filter '*-portable.zip')
          if ($package.Count -ne 1) { throw 'Expected exactly one portable package' }
          $cli[0].FullName | Set-Content evidence/cli-path-local.txt
          Copy-Item (Join-Path $build.BinaryDirectory 'hardened-build.json') evidence/hardened-build.json
          Copy-Item (Join-Path $build.BinaryDirectory 'pe-security.json') evidence/pe-security.json
          $engine = Join-Path $cli[0].DirectoryName 'runtime/nanazip/NanaZip.Universal.Console.exe'
          @{cli_sha256=(Get-FileHash $cli[0].FullName -Algorithm SHA256).Hash; engine_sha256=(Get-FileHash $engine -Algorithm SHA256).Hash; package_sha256=(Get-FileHash $package[0].FullName -Algorithm SHA256).Hash} | ConvertTo-Json | Set-Content evidence/binaries.json -Encoding utf8
      - name: Short harness smoke on the same package
        shell: pwsh
        run: |
          python scripts/test-soak-ordinary-archives.py
          if ($LASTEXITCODE) { throw 'Failure receipt test failed' }
          $cli=(Get-Content evidence/cli-path-local.txt -Raw).Trim()
          python scripts/soak-ordinary-archives.py --cli $cli --out evidence/smoke --duration-seconds 5 --interval-seconds 0.5
          if ($LASTEXITCODE) { throw 'Harness smoke failed; no soak result claimed' }
      - name: Run two ordinary archive tasks for at least 30 minutes
        shell: pwsh
        run: |
          $cli=(Get-Content evidence/cli-path-local.txt -Raw).Trim()
          python scripts/soak-ordinary-archives.py --cli $cli --out evidence/soak --duration-seconds 1800 --interval-seconds 0.5
          if ($LASTEXITCODE) { throw 'Soak failed or incomplete; inspect uploaded evidence' }
      - name: Remove runner-specific path from evidence
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath evidence/cli-path-local.txt -ErrorAction SilentlyContinue
      - name: Upload pass, failure, or partial receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordinary-archive-soak-evidence
          if-no-files-found: warn
          retention-days: 30
          path: evidence/
